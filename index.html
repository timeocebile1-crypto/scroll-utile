const COURS_S3 = [
 {id:"s3irm1",th:"manip",course:true,ue:"irm",e:"🧲",t:"Les trois composants de l’IRM",b:"L’aimant, les gradients et le système RF. Chacun rend l’imagerie possible, et chacun crée ses propres risques. Retiens ces trois sources : tu retrouves le reste par raisonnement.",src:"1 - Instrumentation et sécurité IRM - révision.docx"},
 {id:"s3irm2",th:"manip",course:true,ue:"irm",e:"🧊",t:"L’aimant supraconducteur ne s’arrête jamais",b:"Alliage niobium-titane (NbTi) : le courant passe sans résistance, d’où un B0 homogène et intense. La supraconductivité est obtenue par l’hélium liquide à ≈ −270 °C. Le cryogen-free n’utilise que ~7 L d’hélium.",src:"1 - Instrumentation et sécurité IRM - révision.docx"},
 {id:"s3irm3",th:"manip",course:true,ue:"irm",e:"🔩",t:"L’aimant permanent : avantages et limites",b:"Néodyme-fer-bore, en forme de H ou de C, de 0,2 à 0,5 T. Plus : coût faible, peu de pannes. Moins : examens plus longs et sensibilité à la température.",src:"1 - Instrumentation et sécurité IRM - révision.docx"},
 {id:"s3irm4",th:"manip",course:true,ue:"irm",e:"🔊",t:"Le bruit de l’IRM vient des gradients",b:"Leur commutation les fait vibrer (force de Laplace). Ce n’est ni l’aimant ni les ondes RF. Performance d’un gradient : amplitude (mT/m) et slew rate (T/m/s).",src:"1 - Instrumentation et sécurité IRM - révision.docx"},
 {id:"s3irm5",th:"manip",course:true,ue:"irm",e:"📡",t:"Antennes d’émission et antennes de réception",b:"L’antenne corps entier, dans la coque, sert à l’ÉMISSION. Les antennes de surface, dédiées ou rachis (dans la table) servent à la RÉCEPTION. Certaines sont mixtes.",src:"1 - Instrumentation et sécurité IRM - révision.docx"},
 {id:"s3irm6",th:"manip",course:true,ue:"irm",e:"🔥",t:"La SAR : énergie RF déposée dans le patient",b:"En W/kg, d’où la pesée. Aucun tissu ne doit s’élever de plus de 1 °C (norme IEC 601-2-33). Elle est proportionnelle au CARRÉ de B0 : ×4 à 3 T par rapport à 1,5 T.",steps:["Niveau normal (0) : 0 à 2 W/kg corps, ΔT < 0,5 °C","Niveau 1 : 2 à 4 W/kg corps, ΔT < 1 °C","Tête : 3,2 W/kg aux deux niveaux"],src:"1 - Instrumentation et sécurité IRM - révision.docx"},
 {id:"s3irm7",th:"manip",course:true,ue:"irm",e:"📏",t:"VLE ou VA : ne les confonds pas",b:"La VLE (valeur limite d’exposition) est une grandeur INTERNE au corps, non mesurable aisément. La VA (valeur déclenchant l’action) est MESURABLE au poste de travail, comme la ligne des 0,5 mT. La VA sert à ne jamais atteindre la VLE.",src:"1 - Instrumentation et sécurité IRM - révision.docx"},
 {id:"s3irm8",th:"manip",course:true,ue:"irm",e:"🚧",t:"Les trois lignes autour de l’aimant",b:"Le plus petit chiffre est le plus LOIN de l’aimant.",steps:["0,5 mT : dispositifs médicaux du personnel","3 mT : risque d’attraction et de projection","40 mT : public et travailleuse enceinte"],src:"1 - Instrumentation et sécurité IRM - révision.docx"},
 {id:"s3irm9",th:"manip",course:true,ue:"irm",e:"💨",t:"Le quench : deux cas seulement",b:"L’hélium passe de liquide à gaz, la supraconduction s’arrête et B0 = 0 ; 1 L liquide donne 700 L gazeux. On ne quenche que si un objet est coincé entre patient et machine avec risque vital, ou en cas d’incendie non maîtrisable. Pas « dès qu’un objet est attiré ».",src:"1 - Instrumentation et sécurité IRM - révision.docx"},
 {id:"s3irm10",th:"manip",course:true,ue:"irm",e:"🛏️",t:"Installation : jamais de bras ou jambes croisés",b:"La boucle conductrice, c’est le patient : bras et jambes croisés exposent aux brûlures. Décubitus, bras le long du corps, mousses d’isolation. Poire d’appel et casque à chaque fois.",src:"1 - Instrumentation et sécurité IRM - révision.docx"},
 {id:"s3irm11",th:"manip",course:true,ue:"irm",e:"💧",t:"Pourquoi l’IRM image l’hydrogène",b:"Son noyau n’a qu’un seul proton, il représente 2/3 des atomes de l’organisme et sa résonance est très nette. Il fait 10 % de la masse mais 86 % de la composition chimique : eau et graisse. L’os, les dents et le poumon sont trop pauvres en hydrogène pour être vus.",src:"3 - Le magnétisme nucléaire - révision.docx"},
 {id:"s3irm12",th:"manip",course:true,ue:"irm",e:"⚖️",t:"Seul l’excès de protons sur E1 crée M",b:"Les autres s’annulent deux à deux. L’excès est d’environ 6 pour 1 million à 1,5 T, proportionnel à B0. E1 = basse énergie = parallèle = en excès.",src:"3 - Le magnétisme nucléaire - révision.docx"},
 {id:"s3irm13",th:"manip",course:true,ue:"irm",e:"🎵",t:"Fréquence de Larmor : ω0 = γ · B0",b:"Pour l’hydrogène, γ = 42,5 MHz/T. Donc 1,5 T → 63,8 MHz et 3 T → 127,7 MHz. L’onde RF doit être émise à ωr = ω0 : c’est la résonance.",src:"3 - Le magnétisme nucléaire - révision.docx"},
 {id:"s3irm14",th:"manip",course:true,ue:"irm",e:"🔄",t:"Excitation à 90° : deux effets simultanés",b:"Plan énergétique : les protons en excès passent de E1 à E2, les populations s’égalisent et Mz = 0. Plan vectoriel : les spins se mettent en phase et Mxy devient maximale. Mz = 0 ne veut pas dire que l’aimantation a disparu.",src:"3 - Le magnétisme nucléaire - révision.docx"},
 {id:"s3irm15",th:"manip",course:true,ue:"irm",e:"📈",t:"T1 à 63 %, T2 à 37 %",b:"T1 (spin-réseau) : temps pour que Mz repousse à 63 % de sa valeur. T2 (spin-spin) : temps au bout duquel il ne RESTE que 37 % de Mxy. Le T1 est un échange avec le réseau, le T2 un déphasage des spins entre eux.",src:"3 - Le magnétisme nucléaire - révision.docx"},
 {id:"s3irm16",th:"manip",course:true,ue:"irm",e:"🔢",t:"Les quatre valeurs de relaxation à connaître",b:"T1 : graisse ~250 ms, liquide ~2500 ms. T2 : graisse ~84 ms, liquide ~1400 ms. La graisse est la plus rapide dans les deux cas, et le T2 est environ 10× plus court que le T1.",src:"4 - Rappel des bases physiques - révision.docx"},
 {id:"s3irm17",th:"manip",course:true,ue:"irm",e:"📉",t:"Le FID décroît en T2*, pas en T2",b:"Le FID est une sinusoïde amortie. Sa décroissance est accélérée par les inhomogénéités constantes de B0 : c’est le T2*. Retiens l’ordre T2* < T2 < T1.",src:"3 - Le magnétisme nucléaire - révision.docx"},
 {id:"s3irm18",th:"manip",course:true,ue:"irm",e:"🖼️",t:"Reconnaître une image T1 ou T2",b:"Liquide noir = T1, liquide blanc = T2 (le LCR). En T1, la substance blanche donne plus de signal que la grise ; en T2, c’est l’inverse. Un T1 court repousse plus vite, donc donne plus de signal.",src:"4 - Rappel des bases physiques - révision.docx"},
 {id:"s3irm19",th:"manip",course:true,ue:"irm",e:"⏱️",t:"La séquence spin écho, étape par étape",b:"TR = temps entre deux 90°. TE = temps entre le 90° et le recueil du signal.",steps:["Impulsion de 90°","Impulsion de 180° de rephasage à TE/2","Lecture du signal à TE","Le tout répété à chaque TR"],src:"2 - Les séquences en IRM - révision.docx"},
 {id:"s3irm20",th:"manip",course:true,ue:"irm",e:"🏃",t:"Le 180° inverse le déphasage, pas la rotation",b:"C’est une image en miroir : les derniers précessent les premiers. Il permet d’obtenir le T2 vrai en corrigeant les hétérogénéités CONSTANTES de la machine. Il ne corrige pas les hétérogénéités moléculaires du tissu.",src:"2 - Les séquences en IRM - révision.docx"},
 {id:"s3irm21",th:"manip",course:true,ue:"irm",e:"🎛️",t:"TR et TE sont tes réglages, T1 et T2 le tissu",b:"Ne jamais écrire « T2 = TE ». TE et TR courts donnent une pondération T1 ; TE et TR longs une pondération T2. Les tissus riches en eau sont en hypersignal T2 et en hyposignal T1.",src:"Fiche les Séquences IRM.pdf"},
 {id:"s3irm22",th:"manip",course:true,ue:"irm",e:"🧮",t:"Temps d’acquisition : TA = lignes × TR × excitations",b:"Exemple : 256 × 500 ms × 1 = 128 s, un peu plus de 2 min ; avec 2 excitations, 4 min 16. Le TE n’entre pas dans la formule : c’est le TR qui commande la durée.",src:"2 - Les séquences en IRM - résumé complet.docx"},
 {id:"s3irm23",th:"manip",course:true,ue:"irm",e:"⚡",t:"Écho de gradient : les deux différences à réciter",b:"Un angle de bascule inférieur à 90°, et pas d’impulsion de 180°. Le rephasage se fait par un gradient de lecture bipolaire. Le signal est pondéré en T2*, pas en T2.",src:"2 - Les séquences en IRM - résumé complet.docx"},
 {id:"s3irm24",th:"manip",course:true,ue:"irm",e:"🩸",t:"Écho de gradient : rapide et sensible au fer",b:"TA réduit car pas de 180° et TR raccourci grâce à l’aimantation résiduelle. Il conserve les inhomogénéités : idéal pour l’hémosidérine (saignement) et l’hémochromatose. En contrepartie, artéfacts métalliques et perte de signal rapide.",src:"2 - Les séquences en IRM - révision.docx"},
 {id:"s3irm25",th:"manip",course:true,ue:"irm",e:"📻",t:"Gradient de sélection de coupe : chaque coupe a sa fréquence",b:"Appliqué pendant les impulsions RF (90° et 180°). B0 varie selon la position, par exemple 1,45 / 1,5 / 1,55 T. On envoie une RF sélective à la fréquence de la coupe voulue, comme on règle une radio sur une station.",src:"2 - Les séquences en IRM - révision.docx"},
 {id:"s3irm26",th:"manip",course:true,ue:"irm",e:"🗂️",t:"Codage de phase et codage de fréquence",b:"Le GCP choisit la LIGNE, à chaque TR : n lignes = n codages de phase. Le GCF (gradient de lecture) choisit la COLONNE, pendant le recueil du signal. Phase = déplacement vertical, fréquence = horizontal dans l’espace K.",src:"2 - Les séquences en IRM - révision.docx"},
 {id:"s3irm27",th:"manip",course:true,ue:"irm",e:"🌌",t:"L’espace K n’est pas l’image",b:"C’est le tableau de données brutes ; l’image vient de la transformée de Fourier 2D inverse. Le centre code les basses fréquences, donc le contraste. Les bords codent les hautes fréquences.",src:"Fiche Formation de l'image irm.pdf"},
 {id:"s3irm28",th:"manip",course:true,ue:"irm",e:"🌀",t:"Inversion récupération : STIR et FLAIR",b:"Une RF de 180° d’inversion bascule l’aimantation. Le TI (entre le 180° d’inversion et le 90°) permet de supprimer le signal d’un tissu. STIR supprime la graisse, FLAIR supprime le LCR pour étudier l’œdème.",src:"Fiche les Séquences IRM.pdf"},
 {id:"s3sc1",th:"manip",course:true,ue:"scanner",e:"📏",t:"Le scanner mesure, il ne fabrique pas d’image",b:"Il mesure l’atténuation point par point, en unités Hounsfield. Un mouvement ne rend pas l’image illisible : il la rend FAUSSE mais plausible.",steps:["Acquisition : seule étape irradiante, irréversible","Reconstruction : exige les données brutes","Traitement : toujours rattrapable"],src:"1 - Bases du scanner.docx"},
 {id:"s3sc2",th:"manip",course:true,ue:"scanner",e:"🦐",t:"Les deux fausses allergies au produit iodé",b:"La chaleur pendant l’injection n’est pas une allergie. L’allergie aux fruits de mer concerne les protéines du crustacé : ce n’est PAS une contre-indication. On demande toujours LAQUELLE.",src:"1 - Bases du scanner.docx"},
 {id:"s3sc3",th:"manip",course:true,ue:"scanner",e:"💊",t:"Metformine : on n’arrête pas systématiquement",b:"Seulement en cas d’insuffisance rénale : arrêt 48 h APRÈS l’injection, créatinine avant la reprise. Le risque est l’acidose lactique. L’allaitement, lui, n’a plus besoin d’être suspendu.",src:"2 - Protocoles abdo-pelvis.docx"},
 {id:"s3sc4",th:"manip",course:true,ue:"scanner",e:"🎯",t:"Centrer à l’isocentre, c’est de la radioprotection",b:"La modulation de dose se calcule sur le topogramme. Patient trop bas : surdosage. Trop haut : image bruitée.",src:"1 - Bases du scanner.docx"},
 {id:"s3sc5",th:"manip",course:true,ue:"scanner",e:"⚖️",t:"Résolution spatiale et résolution en densité s’opposent",b:"RS = le détail fin (os, rocher, poumon). RD = la nuance entre densités voisines (cerveau, foie). Voxel plus petit → moins de photons → plus de bruit → RD détruite.",src:"1 - Bases du scanner.docx"},
 {id:"s3sc6",th:"manip",course:true,ue:"scanner",e:"🎚️",t:"Régler pour la RS ou pour la RD",b:"Pour la RS : kV élevé 110–150, petit SFOV, collimation fine, pitch < 1 → fin mais bruité. Pour la RD : kV bas 70–100, mAs > 150, grande collimation → lisse mais moins détaillé.",src:"1 - Bases du scanner.docx"},
 {id:"s3sc7",th:"manip",course:true,ue:"scanner",e:"🧮",t:"Les formules du scanner à connaître",b:"Dose ∝ mAs et bruit ∝ 1/√mAs : il faut ×4 les mAs pour diviser le bruit par 2. mAs effectifs = mAs / pitch. Taille du pixel = FOV / 512 ; K-edge de l’iode = 33 keV.",src:"1 - Bases du scanner.docx"},
 {id:"s3sc8",th:"manip",course:true,ue:"scanner",e:"🌀",t:"Hélicoïdal : jamais de trou entre les coupes",b:"L’algorithme interpole ; ce qui se dégrade, c’est la part de données mesurées (artefact en moulin à vent). Augmenter le pitch ne baisse la dose QU’À mAs constants. Vérifie CTDIvol et PDL avant de valider.",src:"1 - Bases du scanner.docx"},
 {id:"s3sc9",th:"manip",course:true,ue:"scanner",e:"🔪",t:"Filtre dur ou filtre mou",b:"Dur : coupes < 1 mm, contours nets mais très bruité, pour os, poumon, rocher, sinus. Mou : 3–5 mm, image douce, pour cerveau, foie, médiastin. Thorax = 2 séries systématiques, sans dose en plus.",src:"1 - Bases du scanner.docx"},
 {id:"s3sc10",th:"manip",course:true,ue:"scanner",e:"🪟",t:"Piège n°1 : filtre osseux ≠ fenêtre osseuse",b:"Le FILTRE relève de la reconstruction : il crée l’image et exige les données brutes. La FENÊTRE relève du traitement : un clic, réversible, les UH ne bougent pas. Il faut les deux pour bien voir l’os.",src:"1 - Bases du scanner.docx"},
 {id:"s3sc11",th:"manip",course:true,ue:"scanner",e:"🖥️",t:"Le fenêtrage : WL et WW",b:"4096 niveaux d’UH, l’œil n’en voit que 50 : on étale une tranche. WL = où je regarde, WW = combien j’étale, bornes WL ± WW/2. Une fenêtre étroite donne un contraste fort.",src:"1 - Bases du scanner.docx"},
 {id:"s3sc12",th:"manip",course:true,ue:"scanner",e:"🔢",t:"Les fenêtres usuelles (WW / WL)",b:"Crâne 80/35, poumon 1500/−600, médiastin 350/50. Abdomen 400/50, foie 150/70, os 2000/500.",src:"1 - Bases du scanner.docx"},
 {id:"s3sc13",th:"manip",course:true,ue:"scanner",e:"🌡️",t:"Les densités en unités Hounsfield",b:"Air −1000, poumon −900 à −500, graisse −120 à −60. Eau et LCS 0, foie et tissus mous +40 à +70. Os spongieux +300, cortical +1000.",src:"1 - Bases du scanner.docx"},
 {id:"s3sc14",th:"manip",course:true,ue:"scanner",e:"🧊",t:"Volume partiel : acquérir fin, reconstruire épais",b:"Un voxel affiche la MOYENNE de son contenu : os +800 et poumon −800 donnent ~0 UH, valeur qui n’existe pas. On acquiert le plus fin possible et on reconstruit épais si besoin ; l’inverse est impossible.",src:"1 - Bases du scanner.docx"},
 {id:"s3sc15",th:"manip",course:true,ue:"scanner",e:"🔦",t:"MIP, MinIP et 3D",b:"MIP = le plus dense (vaisseaux, nodules). MinIP = le moins dense (bronches, emphysème). On ne conclut jamais sur une 3D, et le post-traitement ne crée aucune information.",src:"1 - Bases du scanner.docx"},
 {id:"s3sc16",th:"manip",course:true,ue:"scanner",e:"⚡",t:"Scanner double énergie : une composition, pas une densité",b:"Bitube : 2 tubes à 90°, émission simultanée à 80 et 140 kV. Il identifie la composition (calculs, goutte) et donne une image virtuelle sans PDCI par soustraction d’iode. Limite : dose totale supérieure, donc sur indication précise.",src:"1 - Bases du scanner.docx"},
 {id:"s3sc17",th:"manip",course:true,ue:"scanner",e:"🗺️",t:"ABDO ou AP : crêtes iliaques ou symphyse",b:"ABDO = coupoles diaphragmatiques → crêtes iliaques. AP = coupoles → symphyse. Topogramme des coupoles à la symphyse, centrage à mi-épaisseur.",src:"2 - Protocoles abdo-pelvis.docx"},
 {id:"s3sc18",th:"manip",course:true,ue:"scanner",e:"🙋",t:"Bras baissés après le topogramme : on refait",b:"La modulation de dose a été calculée sur une épaisseur fausse. Résultat : une image bruitée. Il faut refaire le topogramme, bras relevés.",src:"2 - Protocoles abdo-pelvis.docx"},
 {id:"s3sc19",th:"manip",course:true,ue:"scanner",e:"⏲️",t:"Les quatre temps d’injection en abdo-pelvis",b:"Le PORTAL est l’acquisition fondamentale. Produit standard : 80 cc à 3 cc/s, 3 à 5 cc/s en artériel.",steps:["Sans IV : calcifications, densité de base","Artériel 30–35 s : artères, tumeurs hypervascularisées","Portal 70–80 s : rehaussement maximal des organes","Tardif 3–6 min, excréteur 10 min"],src:"2 - Protocoles abdo-pelvis.docx"},
 {id:"s3sc20",th:"manip",course:true,ue:"scanner",e:"🎯",t:"Bolus tracking : déclenchement à 100 UH",b:"ROI placé dans l’AORTE ABDOMINALE. L’acquisition part quand la densité y dépasse 100 UH. On suit la circulation réelle du patient, pas un délai théorique.",src:"2 - Protocoles abdo-pelvis.docx"},
 {id:"s3sc21",th:"manip",course:true,ue:"scanner",e:"🫀",t:"Le CHC et le wash-out",b:"Spontanément hypodense, il se rehausse FORTEMENT au temps artériel puis redevient isodense au portal : c’est le wash-out. Son apport est exclusivement artériel. D’où le triphasique, indispensable pour séparer bénin et malin.",src:"2 - Protocoles abdo-pelvis.docx"},
 {id:"s3sc22",th:"manip",course:true,ue:"scanner",e:"📊",t:"NRD abdomino-pelvien : 625 mGy·cm et 13 mGy",b:"PDL = 625 mGy·cm et CTDIvol = 13 mGy, pour UNE acquisition chez un adulte de corpulence moyenne. 1200 mGy·cm sur deux séries = 600 par série, donc conforme.",steps:["Combien de séries ?","Quelle corpulence ?","Longueur explorée justifiée ?","Paramètres optimisés (modulation, kV) ?"],src:"2 - Protocoles abdo-pelvis.docx"},
 {id:"s3sc23",th:"manip",course:true,ue:"scanner",e:"🩸",t:"Anévrisme de l’aorte abdominale",b:"Aorte normale 18 mm ± 4, anévrisme à partir de 3 cm ; la rupture tue dans 80 % des cas. Protocole vasculaire : artériel précoce 20–30 s avec smart prep, 80–100 cc à 3–5 cc/s. MIP 3–5 mm et 3D avec MESURE de l’anévrisme.",src:"3 - Pathologies abdo-pelviennes.docx"},
 {id:"s3sc24",th:"manip",course:true,ue:"scanner",e:"🚑",t:"Traumatisme : la logique des trois temps",b:"Tardif seulement si lésion hépatique ou urinaire ; 90 cc à 3 cc/s, penser aux coronales.",steps:["Sans IV : le sang déjà sorti, les fractures","Artériel 20–30 s : le sang qui sort maintenant","Portal : l’organe lésé, incontournable"],src:"3 - Pathologies abdo-pelviennes.docx"},
 {id:"s3sc25",th:"manip",course:true,ue:"scanner",e:"🔥",t:"Appendicite à droite, sigmoïdite à gauche",b:"Le signe commun : l’infiltration de la graisse. Appendicite : FID, 15–30 ans, appendice > 6 mm. Sigmoïdite : FIG, sujet âgé. Protocole inflammatoire : portal 70 s, 80 cc à 3 cc/s.",src:"3 - Pathologies abdo-pelviennes.docx"},
 {id:"s3sc26",th:"manip",course:true,ue:"scanner",e:"⏳",t:"Pancréatite : pas de scanner avant 48 h",b:"Trop tôt, il sous-estime la gravité, sauf biologie limite ou signes de gravité. Le bilan de gravité utilise le score de Balthazar. Protocole : abdo sans IV, abdo artériel 35–45 s, AP portal 90 s.",src:"3 - Pathologies abdo-pelviennes.docx"},
 {id:"s3sc27",th:"manip",course:true,ue:"scanner",e:"🪨",t:"Colique néphrétique : le sans-IV type",b:"Douleur lombaire, hématurie, PAS de fièvre ; on n’injecte pas d’emblée. Densités : calcique ou cystine 450 à 1500 UH, urique ~300 UH. La densité oriente le traitement : alcalinisation pour l’urique, lithotritie pour le calcique.",src:"3 - Pathologies abdo-pelviennes.docx"},
 {id:"s3sc28",th:"manip",course:true,ue:"scanner",e:"🫧",t:"Coloscopie virtuelle : CO2 et zéro injection",b:"Sonde posée en décubitus latéral gauche, 3 L/min, 18–20 mmHg, 2 à 5 L au total. Décubitus PUIS procubitus : un résidu se déplace, un polype reste fixé. Préparation lourde dès J−2 avec marquage des résidus.",src:"4 - Preparations digestives.docx"},
 {id:"s3sc29",th:"manip",course:true,ue:"scanner",e:"💦",t:"Coloscanner à l’eau ou entéroscanner",b:"Colo = côlon : 2 L d’eau tiède par sonde rectale à ballonnet, préparation légère voire aucune. Entéro = grêle : sonde naso-jéjunale 8 F après l’angle de Treitz, 1,5–2 L d’eau. Entéro : à jeun 6–8 h pour les solides, mais PAS de jeûne hydrique.",src:"4 - Preparations digestives.docx"},
 {id:"s3sc30",th:"manip",course:true,ue:"scanner",e:"🧪",t:"Recherche de fistule : jamais de baryte",b:"Toujours des hydrosolubles, car la baryte extravasée donne une péritonite toxique. Toujours dilués au 1/10 à 1/20 pour éviter les artefacts. Acquisition sans opacification, puis avec, à la recherche d’une fuite.",src:"4 - Preparations digestives.docx"},
 {id:"s3mn1",th:"manip",course:true,ue:"mednuc",e:"📡",t:"Émission, pas transmission : le patient est la source",b:"D’où l’exposition externe ET la contamination. MRP = VECTEUR (où) + MARQUEUR (visible) : changer de vecteur, c’est changer d’organe. L’anomalie de fonction précède l’anomalie de forme.",src:"00 - Les bases communes à toutes les scintigraphies - fiche révision.docx"},
 {id:"s3mn2",th:"manip",course:true,ue:"mednuc",e:"⚛️",t:"Carte d’identité du technétium 99m",b:"Émetteur γ pur de 140 keV, fenêtre à 20 % = 126 à 154 keV. Période 6 h : 50 % à 6 h, 25 % à 12 h, 6 % à 24 h. Générateur Mo99/Tc99m, déchets selon la règle des 10 périodes.",src:"00 - Les bases communes à toutes les scintigraphies - fiche révision.docx"},
 {id:"s3mn3",th:"manip",course:true,ue:"mednuc",e:"⏳",t:"Période effective : toujours la plus courte",b:"1/Teff = 1/Tp + 1/Tb. Hydrater et faire uriner raccourcit Tb, donc Teff. Et rappelle-toi : activité (Bq) = nombre de photons, énergie (keV) = force de chaque photon.",src:"00 - Les bases communes à toutes les scintigraphies - fiche révision.docx"},
 {id:"s3mn4",th:"manip",course:true,ue:"mednuc",e:"📷",t:"La chaîne de la gamma-caméra",b:"Sans collimateur, l’image serait totalement floue. La fenêtre rejette le diffusé Compton.",steps:["Collimateur : arrête > 99 % des photons","Cristal NaI(Tl) : scintillation","Photomultiplicateurs : position X, Y","Analyseur d’énergie : fenêtre"],src:"00 - Les bases communes à toutes les scintigraphies - fiche révision.docx"},
 {id:"s3mn5",th:"manip",course:true,ue:"mednuc",e:"🔭",t:"Quel collimateur pour quel examen",b:"LEHR = standard du Tc99m. MEGP = gallium 67. PINHOLE = thyroïde et nourrisson. Compromis permanent entre résolution et sensibilité.",src:"00 - Les bases communes à toutes les scintigraphies - fiche révision.docx"},
 {id:"s3mn6",th:"manip",course:true,ue:"mednuc",e:"🎞️",t:"Les quatre modes d’acquisition",b:"Dynamique 64×64 : peu de coups, de gros pixels bien remplis. Statique 128×128 ou 256×256. Balayage 256×1024, réglé en VITESSE (cm/min) ; TEMP ≈ 64 projections sur 360°.",src:"00 - Les bases communes à toutes les scintigraphies - fiche révision.docx"},
 {id:"s3mn7",th:"manip",course:true,ue:"mednuc",e:"🆚",t:"TEMP ou TEP : ne mélange pas",b:"TEMP : 1 photon γ, Tc99m, caméra qui tourne. TEP : 2 photons de 511 keV à 180°, positon β+, F18-FDG, anneau fixe. Le Tc99m n’émet QUE 140 keV.",src:"00 - Les bases communes à toutes les scintigraphies - fiche révision.docx"},
 {id:"s3mn8",th:"manip",course:true,ue:"mednuc",e:"🔍",t:"Les quatre artefacts et la bonne réaction",b:"Contamination : point chaud hors organe, forme non anatomique. Extravasation : point chaud au point d’injection, image pauvre. Atténuation : zone froide sur une seule incidence ; mouvement : flou. Face à un problème : RALENTIR ou PROLONGER, jamais accélérer.",src:"00 - Les bases communes à toutes les scintigraphies - fiche révision.docx"},
 {id:"s3mn9",th:"manip",course:true,ue:"mednuc",e:"🦴",t:"Scintigraphie osseuse : cible et posologie",b:"Les radiobisphosphonates (HDP/HMDP-Tc99m) s’adsorbent sur l’hydroxyapatite : la cellule cible est l’OSTÉOBLASTE. 10 MBq/kg IV, max 900 MBq (min 40 MBq chez l’enfant). À 4 h : 60 % os, 34 % urines, 6 % circulant.",src:"01 - Scintigraphie osseuse - fiche révision.docx"},
 {id:"s3mn10",th:"manip",course:true,ue:"mednuc",e:"🕒",t:"Les trois temps de la scintigraphie osseuse",b:"L’injection se fait SOUS la caméra.",steps:["Vasculaire T0–3 min : dynamique 40 × 3 s, 64×64","Tissulaire 3–5 min : statique de 3 min, 256×256","Osseux 2–4 h : balayage + statiques + TEMP/TDM"],src:"01 - Scintigraphie osseuse - fiche révision.docx"},
 {id:"s3mn11",th:"manip",course:true,ue:"mednuc",e:"🚰",t:"Scinti osseuse : pas à jeun, mais bien hydraté",b:"Pas de jeûne, pas d’arrêt de traitement : c’est le piège face au digestif. Faire boire, puis vider la vessie avant la caméra car elle masque le bassin. Chez l’enfant, l’hyperfixation des cartilages de conjugaison est NORMALE.",src:"01 - Scintigraphie osseuse - fiche révision.docx"},
 {id:"s3mn12",th:"manip",course:true,ue:"mednuc",e:"🫁",t:"Perfusion pulmonaire : blocage mécanique des MAA",b:"Les MAA (10–100 µm) bloquent les capillaires (≈ 8 µm) : micro-embolisation volontaire. 150 MBq et 200 000 à 700 000 particules. Réduire à 100 000–200 000 en cas d’HTAP, de shunt droite-gauche ou de poumon unique.",src:"02 - Scintigraphie pulmonaire - fiche révision.docx"},
 {id:"s3mn13",th:"manip",course:true,ue:"mednuc",e:"🌬️",t:"Ventilation d’abord, perfusion ensuite",b:"Ventilation au Technegas-Tc99m ou au krypton 81m (192 keV, T = 13 s). La perfusion doit compter 4 fois plus que la ventilation pour la « gommer ». Si l’ordre s’inverse, la ventilation est reportée au LENDEMAIN.",src:"02 - Scintigraphie pulmonaire - fiche révision.docx"},
 {id:"s3mn14",th:"manip",course:true,ue:"mednuc",e:"🧩",t:"Le mismatch signe l’embolie pulmonaire",b:"Ventilation NORMALE + perfusion AMPUTÉE = embolie pulmonaire. Ventilation ET perfusion altérées ensemble = pathologie parenchymateuse. Une scintigraphie normale élimine l’EP ; si elle est positive, retour du patient ALITÉ.",src:"02 - Scintigraphie pulmonaire - fiche révision.docx"},
 {id:"s3mn15",th:"manip",course:true,ue:"mednuc",e:"🩸",t:"Pièges de la scintigraphie pulmonaire",b:"Aucune contre-indication absolue, grossesse incluse (perfusion seule). Les MAA sont un dérivé du sang : traçabilité du lot. Retourner la seringue 2–3 fois avant d’injecter, bras au-dessus de la tête.",src:"02 - Scintigraphie pulmonaire - fiche révision.docx"},
 {id:"s3mn16",th:"manip",course:true,ue:"mednuc",e:"🫘",t:"DMSA : la masse rénale fonctionnelle",b:"Cible : cortex, cellules du tube contourné proximal. Attente 4 à 6 h, puis 8 statiques de 10 min (40 min). FRR normale = 50 % ± 5 %, avec comptage de la seringue pleine puis vide.",src:"03 - Scintigraphie rénale statique (DMSA) - fiche révision.docx"},
 {id:"s3mn17",th:"manip",course:true,ue:"mednuc",e:"🆚",t:"DMSA ou MAG3 : quelle question posée ?",b:"DMSA (statique) : « Combien de rein fonctionnel ? », délai 4 à 6 h. MAG3/DTPA (dynamique) : « Est-ce que ça s’écoule ? », images dès l’injection. L’un donne une FRR en %, l’autre un rénogramme.",src:"03 - Scintigraphie rénale statique (DMSA) - fiche révision.docx"},
 {id:"s3mn18",th:"manip",course:true,ue:"mednuc",e:"💧",t:"MAG3 tubulaire, DTPA glomérulaire",b:"MAG3 : capté puis SÉCRÉTÉ par le tubule, extraction 45 % au premier passage, à préférer si créatininémie > 200 µmol/L. DTPA : FILTRÉ par le glomérule, c’est lui qui mesure le DFG. Détecteur en face postérieure, sauf greffon (antérieure).",src:"04 - Scintigraphie rénale dynamique (MAG3 - DTPA) - fiche révision.docx"},
 {id:"s3mn19",th:"manip",course:true,ue:"mednuc",e:"📈",t:"Les trois phases du rénogramme",b:"Bruit de fond corrigé deux fois : zone péri-rénale et zone aortique.",steps:["Pic vasculaire : premier passage","Captation croissante : capacité fonctionnelle","Tmax ≈ 3–5 min (entrées = sorties), puis excrétion"],src:"04 - Scintigraphie rénale dynamique (MAG3 - DTPA) - fiche révision.docx"},
 {id:"s3mn20",th:"manip",course:true,ue:"mednuc",e:"💊",t:"Test au Lasilix ou test au Captopril",b:"Lasilix à la 20ᵉ min (20 mg adulte) : si la courbe NE REDESCEND PAS, obstacle mécanique. Captopril 50 mg croqué : retard du Tmax = HTA rénovasculaire. Captopril : IEC arrêtés depuis 2 jours, PA toutes les 15 min.",src:"04 - Scintigraphie rénale dynamique (MAG3 - DTPA) - fiche révision.docx"},
 {id:"s3mn21",th:"manip",course:true,ue:"mednuc",e:"❤️",t:"Perfusion myocardique : ischémie ou nécrose",b:"Normal à l’effort = perfusion normale. Hypofixation à l’effort NORMALISÉE au repos = ISCHÉMIE. Hypofixation PERSISTANTE au repos = NÉCROSE, ou artefact si l’épaississement pariétal est conservé.",src:"05 - Explorations cardiaques isotopiques - fiche révision.docx"},
 {id:"s3mn22",th:"manip",course:true,ue:"mednuc",e:"☕",t:"12 h sans café ni banane avant une scinti cardiaque",b:"Café, thé, chicorée, cola, chocolat, banane et vanille sont des antagonistes de l’adénosine. Ils annuleraient l’effet du vasodilatateur. Arrêt des bradycardisants 2 à 3 jours avant.",src:"05 - Explorations cardiaques isotopiques - fiche révision.docx"},
 {id:"s3mn23",th:"manip",course:true,ue:"mednuc",e:"🏃",t:"Les trois tests de stress cardiaque",b:"Épreuve d’effort > 85 % de la FMT, Persantine IV lente (délai 4 min) ou Rapiscan IVD (20–40 s). L’asthme contre-indique la Persantine, pas le Rapiscan. Antidote : aminophylline ou caféine.",src:"05 - Explorations cardiaques isotopiques - fiche révision.docx"},
 {id:"s3mn24",th:"manip",course:true,ue:"mednuc",e:"⚖️",t:"Traceurs technétiés ou thallium 201",b:"Technétiés : 140 keV, 6 h, mitochondries, PAS de redistribution, utilisés en routine. Thallium : analogue du K⁺, 73 h, REDISTRIBUTION qui permet d’étudier la viabilité. Repos après effort : 2 à 4 h avec activité × 3.",src:"05 - Explorations cardiaques isotopiques - fiche révision.docx"},
 {id:"s3mn25",th:"manip",course:true,ue:"mednuc",e:"🫀",t:"Artefacts de la scinti cardiaque",b:"Activité digestive : gêne la paroi INFÉRIEURE (eau froide, aliment gras, marche). Atténuation mammaire : paroi ANTÉRIEURE en procubitus → refaire en décubitus dorsal. Le gating aide à distinguer nécrose et artefact.",src:"05 - Explorations cardiaques isotopiques - fiche révision.docx"},
 {id:"s3mn26",th:"manip",course:true,ue:"mednuc",e:"📊",t:"Ventriculographie isotopique : mesurer la FEVG",b:"Indication phare : surveillance sous chimiothérapie cardiotoxique. FEVG = (VTD − VTS) / VTD, incidence OAG 35 à 45°. Le planaire sous-estime la FEVG et ne voit pas le VD.",src:"05 - Explorations cardiaques isotopiques - fiche révision.docx"},
 {id:"s3mn27",th:"manip",course:true,ue:"mednuc",e:"🍋",t:"Pertechnétate : glandes salivaires et Meckel",b:"Le Tc99m libre se fixe sur la thyroïde, les glandes salivaires et la muqueuse gastrique. Glandes salivaires : jus de citron à la 15ᵉ min pour étudier la VIDANGE. Meckel : on cherche la muqueuse gastrique ectopique, pas le diverticule.",src:"06 - Scintigraphies digestives - fiche révision.docx"},
 {id:"s3mn28",th:"manip",course:true,ue:"mednuc",e:"🍳",t:"Digestif : à jeun 12 h, sauf l’hémorragie",b:"Vidange gastrique : omelette de 2 œufs, attention à l’ALLERGIE AUX ŒUFS, deux isotopes pour solides et liquides. RGO : traceur INGÉRÉ. Hémorragie digestive : aucune préparation, mais le saignement doit être ACTIF.",src:"06 - Scintigraphies digestives - fiche révision.docx"},
 {id:"s3mn29",th:"manip",course:true,ue:"mednuc",e:"🦶",t:"Lymphoscintigraphie : sous-cutanée et après marche",b:"Nanocolloïdes de 80 nm, 37 MBq par injection, dans les 1ᵉʳ et 4ᵉ espaces interdigitaux des deux pieds. C’est le MÉDECIN qui injecte, et c’est douloureux. Pas de pompe lymphatique : le muscle en tient lieu, d’où les images après MARCHE.",src:"07 - Lymphoscintigraphie et ganglion sentinelle - fiche révision.docx"},
 {id:"s3mn30",th:"manip",course:true,ue:"mednuc",e:"🎯",t:"Ganglion sentinelle du sein",b:"Injection péri-aréolaire, chaîne axillaire le plus souvent. Galette de plomb sur le point d’injection pour ne pas éblouir le ganglion voisin. Sentinelle positif → curage, avec risque de lymphœdème secondaire.",src:"07 - Lymphoscintigraphie et ganglion sentinelle - fiche révision.docx"},
 {id:"s3mn31",th:"manip",course:true,ue:"mednuc",e:"🦠",t:"Leucocytes marqués : la chronologie",b:"Aiguille 19 G au prélèvement et à la réinjection, sinon les cellules ne migrent plus. NFS de J−3 et scinti osseuse récente obligatoires.",steps:["Prélèvement 45 mL sur 15 mL d’ACD","Marquage ≈ 3 h en radiopharmacie, réinjection 222 MBq","30 min–1 h : statiques + vue du thorax (CQ)","4 h puis 24 h au même centrage"],src:"08 - Infectiologie - leucocytes marqués et gallium 67 - fiche révision.docx"},
 {id:"s3mn32",th:"manip",course:true,ue:"mednuc",e:"🧲",t:"Gallium 67 : haute énergie, longue période",b:"93, 184 et 296 keV, T = 78 h : mauvaise résolution et forte dosimétrie. Collimateur MEGP, jamais LEHR, balayage LENT à 8 cm/min. Allaitement : arrêt DÉFINITIF.",src:"08 - Infectiologie - leucocytes marqués et gallium 67 - fiche révision.docx"},
 {id:"s3so1",th:"manip",course:true,ue:"soin",e:"📻",t:"Le schéma de Shannon (1952)",b:"Émetteur → codage → canal → décodage → récepteur, avec un feed-back. Il est influencé par des variables psychologiques, cognitives et sociales.",src:"Chap 1 - Fiche de révision.docx"},
 {id:"s3so2",th:"manip",course:true,ue:"soin",e:"🔻",t:"L’entonnoir : le patient retient environ 20 %",b:"100 → 80 → 70 → 60 → 50 → 20 → 10 %. Conséquence pour toi : consignes courtes, simples, répétées. Et vérifie la compréhension en faisant reformuler.",src:"Chap 1 - Fiche de révision.docx"},
 {id:"s3so3",th:"manip",course:true,ue:"soin",e:"🗣️",t:"Para-verbal ou non verbal : le piège",b:"Le para-verbal, c’est COMMENT on dit : le ton, le volume, le débit. Le non verbal, c’est le corps, sans les mots. Le verbal, c’est le contenu : des mots adaptés, sans jargon.",src:"Chap 1 - Fiche de révision.docx"},
 {id:"s3so4",th:"manip",course:true,ue:"soin",e:"🦀",t:"Dénotation ou connotation",b:"Dénotation = sens littéral, objectif : Dénotation = Dictionnaire. Connotation = sens implicite, subjectif : « crabe » évoque le cancer. En imagerie, « tumeur », « produit » ou « injection » peuvent faire peur.",src:"Chap 1 - Fiche de révision.docx"},
 {id:"s3so5",th:"manip",course:true,ue:"soin",e:"👁️",t:"Le non verbal l’emporte toujours",b:"Six composantes : expressions faciales, regard, posture, gestes, toucher, proxémie. Il paraît plus authentique car il reflète des émotions moins contrôlées. En cas de contradiction, c’est lui qui l’emporte.",src:"Chap 1 - Fiche de révision.docx"},
 {id:"s3so6",th:"manip",course:true,ue:"soin",e:"🧍",t:"Les quatre postures",b:"Expansion, rejet et contraction sont des obstacles. Seule l’approche favorise la relation. Attention : la contraction n’est pas « neutre », elle traduit abattement ou soumission.",src:"Chap 1 - Fiche de révision.docx"},
 {id:"s3so7",th:"manip",course:true,ue:"soin",e:"🔗",t:"Les six liens verbal / non verbal : ARRSCC",b:"Accentuation, Répétition, Régulation, Substitution, Complément, Contradiction. Hausser les épaules sans parler = substitution. Hocher la tête pour inviter à continuer = régulation.",src:"Chap 1 - Fiche de révision.docx"},
 {id:"s3so8",th:"manip",course:true,ue:"soin",e:"👂",t:"Les quatre canaux de perception",b:"Auditif, visuel, olfactif, tactile. Le canal olfactif est le plus souvent oublié. Et 85 % des actes soignants passent par le toucher.",src:"Chap 1 - Fiche de révision.docx"},
 {id:"s3so9",th:"manip",course:true,ue:"soin",e:"🤝",t:"Définition de la relation d’aide",b:"Une relation empathique où le soignant est assez proche pour percevoir ce que ressent le malade. Mais assez distant et non fusionnel pour ne pas se projeter ni agir à sa place. C’est une partie intégrante du rôle soignant.",src:"Chap 2 - Fiche de révision.docx"},
 {id:"s3so10",th:"manip",course:true,ue:"soin",e:"🚫",t:"Les cinq pièges de la communication",b:"Le jargon, la minimisation de la souffrance, le manque de temps, les jugements, les questions fermées. « Ne vous inquiétez pas » est un piège : rassurer ≠ minimiser.",src:"Chap 2 - Fiche de révision.docx"},
 {id:"s3so11",th:"manip",course:true,ue:"soin",e:"🧱",t:"Les trois piliers de Carl Rogers : E.C.C.",b:"Empathie, Congruence (authenticité), Considération positive inconditionnelle. L’écoute active, c’est une implication totale, verbal et non verbal. L’écoute passive, c’est simplement entendre.",src:"Chap 2 - Fiche de révision.docx"},
 {id:"s3so12",th:"manip",course:true,ue:"soin",e:"🛠️",t:"Les huit techniques de l’écoute active",b:"Reformulation, clarification, confrontation, feed-back, partage, silence, questions ouvertes, encouragements. Le partage se fait avec prudence et parcimonie, car il risque d’inverser aidant et aidé.",src:"Chap 2 - Fiche de révision.docx"},
 {id:"s3so13",th:"manip",course:true,ue:"soin",e:"🎯",t:"Reconnaître une technique d’écoute active",b:"« Vous dites que ça va, mais vous serrez les accoudoirs » = confrontation. « Une douleur ou une oppression ? » = clarification. « Je sens que tout ça vous pèse » = feed-back.",src:"Chap 2 - Fiche de révision.docx"},
 {id:"s3so14",th:"manip",course:true,ue:"soin",e:"💬",t:"Valider une émotion en quatre étapes",b:"Valider, ce n’est pas donner raison au patient.",steps:["Identifier l’émotion","La nommer","La normaliser","Accueillir la réponse du patient"],src:"Chap 2 - Fiche de révision.docx"},
 {id:"s3so15",th:"manip",course:true,ue:"soin",e:"⚠️",t:"Empathie n’est pas sympathie",b:"« Moi aussi j’aurais peur » = projection, à éviter. « Je comprends que ça puisse vous inquiéter » = empathie. Et la confrontation consiste à pointer une contradiction, pas à affronter le patient.",src:"Chap 2 - Fiche de révision.docx"},
 {id:"s3so16",th:"manip",course:true,ue:"soin",e:"👋",t:"Après l’image : ne bâcle pas la fin",b:"Annonce la fin et vérifie que le patient va bien. Informe-le sur la suite et où attendre les résultats. Raccompagne-le, avec une formule de politesse.",src:"Chap 2 - Fiche de révision.docx"},
 {id:"s3so17",th:"manip",course:true,ue:"soin",e:"✋",t:"Le toucher : un acte professionnel et éthique",b:"Il doit être réfléchi, adapté, respectueux. Cinq mots de l’éthique : respect, consentement, intimité, dignité, pudeur. 85 % des actes soignants sont liés au toucher.",src:"Chap 3 - Fiche de révision.docx"},
 {id:"s3so18",th:"manip",course:true,ue:"soin",e:"🧩",t:"Les six types de toucher : TRACSE",b:"Technique, Relationnel, Affectif, Clinique, Symbolique, Éducatif. Le toucher affectif est à éviter : il crée une confusion des rôles. Tenir la main en soins palliatifs, avec accord = symbolique.",src:"Chap 3 - Fiche de révision.docx"},
 {id:"s3so19",th:"manip",course:true,ue:"soin",e:"🔁",t:"Relationnel ou symbolique, technique ou clinique",b:"Relationnel = rassurer, créer du lien ; symbolique = signification implicite, comme en fin de vie. Technique = réaliser un acte ; clinique = rechercher un signe. Positionner un genou = technique, guider la main du patient = éducatif.",src:"Chap 3 - Fiche de révision.docx"},
 {id:"s3so20",th:"manip",course:true,ue:"soin",e:"📋",t:"La séquence du toucher en imagerie",b:"Cinq verbes : prévenir → expliquer → demander → observer → adapter. Pendant le geste, observe crispation, gêne ou retrait. Respecte toujours la pudeur.",src:"Chap 3 - Fiche de révision.docx"},
 {id:"s3so21",th:"manip",course:true,ue:"soin",e:"📜",t:"Le consentement avant tout toucher",b:"Consentement et information adaptée : Code de déontologie infirmier, art. R.4312-13 / R.4312-14. L’intention de rassurer ne suffit pas à toucher sans demander. Un refus doit toujours être respecté.",src:"Chap 3 - Fiche de révision.docx"},
 {id:"s3so22",th:"manip",course:true,ue:"soin",e:"🌍",t:"Les cinq facteurs de perception du toucher",b:"Âge, Culture, Sexe, Histoire personnelle, Contexte : mnémo ACSHC. Tous les patients n’ont donc pas la même perception. Le patient vulnérable s’oppose difficilement : va chercher son accord activement.",src:"Chap 3 - Fiche de révision.docx"},
 {id:"s3ph1",th:"manip",course:true,ue:"physio",e:"⚡",t:"Qui accélère, qui ralentit le cœur",b:"Le système orthosympathique (de la fuite) augmente le rythme par des hormones, l’adrénaline. Le parasympathique (de la récupération) le diminue par un nerf, le nerf vague. Le cœur, lui, fonctionne comme deux pompes, droite et gauche.",src:"cours 1 Le cœur.pptx"},
 {id:"s3ph2",th:"manip",course:true,ue:"physio",e:"🩻",t:"Quel examen pour explorer le cœur",b:"Échographie : première intention, dynamique. IRM : « gold standard », non invasive. TDM : en urgence ou si IRM impossible, plus rapide, pas de contre-indication liée au matériel.",src:"cours 1 Le cœur.pptx"},
 {id:"s3ph3",th:"manip",course:true,ue:"physio",e:"📈",t:"Le gating cardiaque fige le cœur",b:"On synchronise l’acquisition avec le cycle cardiaque du patient. L’onde R de l’ECG est le « top départ » : elle marque le début de la contraction ventriculaire. On prévoit ainsi les phases de mouvement et de repos.",src:"cours 1 Le cœur.pptx"},
 {id:"s3ph4",th:"manip",course:true,ue:"physio",e:"🩸",t:"Les quatre fonctions du sang",b:"Le transport (O2/CO2, nutriments, hormones, cellules immunitaires). La régulation calorifique et le pouvoir « tampon » sur les ions H+. La gestion des volumes hydriques.",src:"Système Vasculaire et Lymphatique.pptm"},
 {id:"s3ph5",th:"manip",course:true,ue:"physio",e:"⏱️",t:"Combien de temps met le sang",b:"Environ 1 min pour une boucle complète, sur 100 000 km de vaisseaux. Coronaires 3 à 5 s, poumons 5 à 8 s, cerveau 8 à 10 s. Membres inférieurs 30 à 45 s.",src:"Système Vasculaire et Lymphatique.pptm"},
 {id:"s3ph6",th:"manip",course:true,ue:"physio",e:"🎈",t:"Capacitance veineuse et élastance artérielle",b:"Capacitance : aptitude des veines à se dilater à pression constante, comme un ballon ; elles contiennent environ 2/3 du sang. Élastance : aptitude des artères à retrouver leur taille après étirement, ce qui maintient la « vague » du pouls.",src:"Système Vasculaire et Lymphatique.pptm"},
 {id:"s3ph7",th:"manip",course:true,ue:"physio",e:"🔁",t:"Définition d’un système porte",b:"Succession de deux arbres capillaires sans repasser par le cœur. Exemples : système porte hépatique, hypothalamo-hypophysaire, rénal. Le rein est un système porte « artériel ».",src:"Système Vasculaire et Lymphatique.pptm"},
 {id:"s3ph8",th:"manip",course:true,ue:"physio",e:"🫘",t:"Le rein, filtre de sortie",b:"Clairance = capacité d’un organe à éliminer une substance d’un liquide biologique par unité de temps. Glomérule : filtration mécanique grossière. Tubule proximal : réabsorption massive sans régulation ; tubule distal : réabsorption fine et modulable.",src:"Système Vasculaire et Lymphatique.pptm"},
 {id:"s3ph9",th:"manip",course:true,ue:"physio",e:"📡",t:"Sinus et glomus carotidiens",b:"Sinus carotidien = barorécepteur : il capte l’étirement de la paroi selon la pression, vers le nerf vague. Glomus carotidien = chimiorécepteur : il mesure O2, CO2 et pH, vers le bulbe rachidien.",src:"Système Vasculaire et Lymphatique.pptm"},
 {id:"s3ph10",th:"manip",course:true,ue:"physio",e:"💧",t:"Les rôles du système lymphatique",b:"Drainer l’excédent d’eau périphérique. Transférer les plus gros lipides des intestins vers le sang en « évitant » le foie. Assurer l’immunité par les ganglions, qui filtrent la lymphe et produisent des anticorps.",src:"Système Vasculaire et Lymphatique.pptm"},
 {id:"s3ph11",th:"manip",course:true,ue:"physio",e:"🧱",t:"Thrombus blanc ou thrombus rouge",b:"Athérogénèse : dépôt de lipides sur la paroi artérielle, plaque recouverte d’une chape fibreuse = thrombus blanc. Thrombogénèse : stase circulatoire, le plus souvent aux membres inférieurs, plaquettes, fibrine et beaucoup de globules rouges = thrombus rouge.",src:"Physiopathologie cardiovasculaire.pptm"},
 {id:"s3ph12",th:"manip",course:true,ue:"physio",e:"🔧",t:"La pompe ou les tuyaux",b:"Les maladies cardiovasculaires viennent soit des tuyaux (athérosclérose, thrombose), soit de la pompe (endocardite, myocardite, insuffisance cardiaque). L’HTA est surnommée « le tueur silencieux ». La fibrillation auriculaire est l’arythmie la plus répandue.",src:"Physiopathologie cardiovasculaire.pptm"},
 {id:"s3ph13",th:"manip",course:true,ue:"physio",e:"💔",t:"Angine de poitrine ou infarctus",b:"Angine = ischémie passagère ; infarctus = ischémie définitive. Angioplastie seulement si le délai est court : moins de 90 min depuis le début des symptômes (120 min maximum). Sinon, thrombolyse.",src:"Angine de poitrine_infarctus.pdf"},
 {id:"s3ph14",th:"manip",course:true,ue:"physio",e:"🧠",t:"AVC : 80 % ischémiques, 20 % hémorragiques",b:"Ischémique : un caillot bouche une artère. Hémorragique : un vaisseau se rompt et l’hématome comprime le cerveau. Thrombolyse IV dans les 4 h 30, thrombectomie idéalement dans les 6 h.",src:"LAccident-Vasculaire-Cerebral-AVC.pdf"},
 {id:"s3ph15",th:"manip",course:true,ue:"physio",e:"🦵",t:"TVP : trois causes, un risque d’embolie",b:"Stase veineuse, lésion de la paroi, hypercoagulation. Le caillot peut migrer vers les artères pulmonaires : plus de 90 % des EP viennent d’une TVP des membres inférieurs. Examen clé : l’écho-Doppler veineux.",src:"TVD.pptx"},
 {id:"s3ph16",th:"manip",course:true,ue:"physio",e:"🫁",t:"Les chiffres de la respiration",b:"12 à 15 cycles par minute. Volume courant ≈ 0,5 L, soit 6 à 8 L d’air par minute. Cela représente 250 mL d’O2 inspiré et 200 mL de CO2 expiré par minute.",src:"Système respiratoire IMRT 202526.pptx"},
 {id:"s3ph17",th:"manip",course:true,ue:"physio",e:"📊",t:"Les volumes pulmonaires",b:"Volume courant 0,5 L (0,35 L renouvelé + 0,15 L d’espace mort). Réserve inspiratoire 3 L, réserve expiratoire 1,5 L, volume résiduel 1 L. Capacité vitale 5 L, volume pulmonaire total 6 L.",src:"Système respiratoire IMRT 202526.pptx"},
 {id:"s3ph18",th:"manip",course:true,ue:"physio",e:"🧼",t:"Pneumocytes et surfactant",b:"Les pneumocytes I font les échanges gazeux et ne se divisent pas. Les pneumocytes II sécrètent le surfactant, qui réduit la tension de surface et évite le collapsus des alvéoles. Son défaut : détresse respiratoire du nouveau-né prématuré.",src:"Système respiratoire IMRT 202526.pptx"},
 {id:"s3ph19",th:"manip",course:true,ue:"physio",e:"🌬️",t:"Surface d’échange : de 2,5 cm² à 100 m²",b:"Surface de section cumulée : trachée 2,5 cm², bronchioles terminales 1 m², alvéoles 100 m². La plèvre a deux feuillets, viscéral et pariétal. Sa pression négative garde les poumons collés à la paroi.",src:"Système respiratoire IMRT 202526.pptx"},
 {id:"s3ph20",th:"manip",course:true,ue:"physio",e:"⚗️",t:"pH sanguin : reins durables, poumons rapides",b:"pH idéal = 7,4. Les reins le régulent de façon pérenne en éliminant les ions H+. Les poumons gèrent la « crise » par le CO2 : en acidocétose diabétique, le patient hyperventile.",src:"Système respiratoire IMRT 202526.pptx"},
 {id:"s3ph21",th:"manip",course:true,ue:"physio",e:"🧭",t:"Ce qui commande la respiration",b:"La plupart du temps, c’est la PCO2 : les chémorécepteurs centraux du bulbe captent le pH du LCR. Trop de CO2 → pH qui baisse → ventilation augmentée. La PO2 ne devient le moteur qu’en hypoxie sévère, via les chémorécepteurs de l’aorte.",src:"Système respiratoire IMRT 202526.pptx"},
 {id:"s3ph22",th:"manip",course:true,ue:"physio",e:"🎤",t:"Les trois composantes de la phonation",b:"La soufflerie (appareil respiratoire), le vibrateur (larynx), les résonateurs (pharynx, cavités buccale et nasales, sinus). Les cordes vocales s’ouvrent sous la pression sous-glottique puis se referment par effet Bernoulli. Le cycle se répète 100 à 250 fois par seconde.",src:"Phonation et déglutition.pptx"},
 {id:"s3ph23",th:"manip",course:true,ue:"physio",e:"🍽️",t:"Phase pharyngée : la triple protection",b:"Élévation du larynx, fermeture des cordes vocales, bascule de l’épiglotte. La déglutition se produit 500 à 1200 fois par jour, pilotée par le bulbe rachidien. Pour voir une fausse route : vidéofluoroscopie ou ciné-IRM.",src:"Phonation et déglutition.pptx"},
 {id:"s3ph24",th:"manip",course:true,ue:"physio",e:"🔊",t:"Les décibels ne s’additionnent pas",b:"+3 dB = doublement de l’énergie sonore, +10 dB = ×10. Deux machines à 60 dB font 63 dB, pas 120. Gênant dès 85 dB(A), douleur dès 115 dB(A).",src:"PHYSIO OREILLE.pptx"},
 {id:"s3ph25",th:"manip",course:true,ue:"physio",e:"🎹",t:"La tonotopie cochléaire",b:"L’oreille perçoit de 20 Hz à 20 000 Hz, surtout de 1000 à 4000 Hz. Aigus près de la BASE de la cochlée, graves près de l’APEX ; sous 200 Hz, toute la membrane vibre. Les récepteurs des aigus dégénèrent en premier : c’est la presbyacousie.",src:"PHYSIO OREILLE.pptx"},
 {id:"s3ph26",th:"manip",course:true,ue:"physio",e:"🦻",t:"Cellules ciliées internes et externes",b:"L’organe de Corti compte environ 16 000 cellules ciliées. Les CCI sont les vraies cellules sensorielles : siège de la transduction mécano-électrique. Les CCE sont des modulateurs : elles amplifient ou atténuent (effet « cocktail party »).",src:"PHYSIO OREILLE.pptx"},
 {id:"s3ph27",th:"manip",course:true,ue:"physio",e:"🪨",t:"Équilibre statique : saccule et utricule",b:"Les macules contiennent des otolithes de carbonate de calcium. Le saccule informe plutôt sur les mouvements verticaux, l’utricule sur les horizontaux. Cils inclinés vers le kinocil = dépolarisation.",src:"PHYSIO OREILLE.pptx"},
 {id:"s3ph28",th:"manip",course:true,ue:"physio",e:"🎢",t:"Équilibre dynamique : les canaux semi-circulaires",b:"Les crêtes ampullaires réagissent aux changements de vitesse des rotations. L’endolymphe, par inertie, part dans le sens opposé et déforme la cupule. Le système vestibulaire est le seul sens dont la perte peut être largement compensée par le cerveau.",src:"PHYSIO OREILLE.pptx"},
 {id:"s3ph29",th:"manip",course:true,ue:"physio",e:"👂",t:"Surdité de transmission, de perception ou mixte",b:"Transmission : oreille externe et moyenne. Perception : oreille interne et voies nerveuses auditives. Mixte : les deux à la fois.",src:"PHYSIO OREILLE.pptx"},
 {id:"s3ph30",th:"manip",course:true,ue:"physio",e:"🧬",t:"Leucémie, lymphome ou myélome",b:"Blaste cancéreux qui envahit le sang = leucémie aiguë. Lymphocyte B cancéreux dans les ganglions = lymphome. Plasmocyte cancéreux dans la moelle = myélome : attention aux fractures lors des transferts.",src:"présentation hémato.pptx"},
 {id:"s3ph31",th:"manip",course:true,ue:"physio",e:"🩺",t:"Hématologie : les réflexes du manip",b:"Créatinémie avant toute injection iodée et asepsie préventive (immunodépression). En TEP, le jeûne est crucial : concurrence glucose / FDG ; réponse évaluée par le score de Deauville. Compression médullaire par une masse : urgence IRM absolue.",src:"présentation hémato.pptx"},
 {id:"s3ph32",th:"manip",course:true,ue:"physio",e:"🦠",t:"VIH : quatre phases sans traitement",b:"Transmission mère-enfant : environ 25 % sans traitement, jusqu’à 1 % avec suivi et sans allaitement.",steps:["Primo-infection : signes pseudo-grippaux","Phase asymptomatique : jusqu’à 10 ans","Phase symptomatique","SIDA : infections opportunistes"],src:"UE 2.7 SIDA.pptx"},
 {id:"s3an1",th:"manip",course:true,ue:"anatomie",e:"🧠",t:"Pourquoi le cerveau supporte si mal l’ischémie",b:"Ses réserves d’énergie sont quasi inexistantes et son métabolisme est intense et constant. Les neurones sont amitotiques, avec un stock de cellules souches négligeable. Quelques minutes sans apport suffisent à créer des lésions irréversibles.",src:"Système lymphatique et vasculaire cou et crâne2.pptx"},
 {id:"s3an2",th:"manip",course:true,ue:"anatomie",e:"🩸",t:"Carotides 80 %, vertébrales 20 %",b:"L’artère carotide commune assure environ 80 % de l’apport, l’artère vertébrale 20 %. La carotide commune se divise en carotide interne et carotide externe.",src:"Système lymphatique et vasculaire cou et crâne2.pptx"},
 {id:"s3an3",th:"manip",course:true,ue:"anatomie",e:"🌳",t:"La carotide externe vascularise le superficiel",b:"Ses branches : thyroïdienne supérieure, linguale, faciale, maxillaire. Elles vascularisent toutes les structures superficielles. Elle chemine en arrière de la mandibule.",src:"Système lymphatique et vasculaire cou et crâne2.pptx"},
 {id:"s3an4",th:"manip",course:true,ue:"anatomie",e:"🪨",t:"La carotide interne passe dans le rocher",b:"Son trajet traverse l’os temporal, à travers le rocher. Ses branches intracrâniennes sont les cérébrales moyenne et antérieure. Elle alimente le polygone de Willis.",src:"Système lymphatique et vasculaire cou et crâne2.pptx"},
 {id:"s3an5",th:"manip",course:true,ue:"anatomie",e:"🦴",t:"L’artère vertébrale, réseau postérieur",b:"Elle chemine dans le cou à travers les vertèbres cervicales. Elle irrigue la partie postérieure : tronc, cervelet. Ses branches : artères cérébelleuses et artère basilaire.",src:"Système lymphatique et vasculaire cou et crâne2.pptx"},
 {id:"s3an6",th:"manip",course:true,ue:"anatomie",e:"⭕",t:"Le polygone de Willis : entrées et sorties",b:"Afférences : artères vertébrales et carotides internes. Efférences : artères cérébrales antérieure, moyenne, postérieure et cérébelleuses. Artères du polygone : communicantes antérieure et postérieures, tronc basilaire.",src:"Système lymphatique et vasculaire cou et crâne2.pptx"},
 {id:"s3an7",th:"manip",course:true,ue:"anatomie",e:"🛟",t:"Le polygone de Willis, une roue de secours",b:"Sa fonction principale : assurer une collatéralité du flux sanguin. Si une artère est sténosée ou obstruée, le sang est redirigé par les autres. Mais il n’est pas toujours « parfaitement fermé » : certains sont plus vulnérables aux AVC.",src:"Système lymphatique et vasculaire cou et crâne2.pptx"},
 {id:"s3an8",th:"manip",course:true,ue:"anatomie",e:"🩹",t:"Réseau veineux superficiel et profond",b:"Superficiel : veine jugulaire externe et veine vertébrale (drainage cervical, différent de l’artère). Profond : veine jugulaire interne, principale veine de drainage de la tête et du cou. Elle prolonge les sinus veineux du crâne.",src:"Système lymphatique et vasculaire cou et crâne2.pptx"},
 {id:"s3an9",th:"manip",course:true,ue:"anatomie",e:"🧱",t:"Les sinus veineux ne sont pas des veines",b:"Leurs parois sont des dédoublements de la dure-mère, rigides, ce qui empêche toute montée de pression. Pas de valvules, une pression encore plus faible que dans les veines. Ils sont dissociés de toute artère.",src:"Système lymphatique et vasculaire cou et crâne2.pptx"},
 {id:"s3an10",th:"manip",course:true,ue:"anatomie",e:"🔁",t:"Rôle des sinus veineux du crâne",b:"Ils drainent la totalité de l’encéphale vers le confluent des sinus. Ils résorbent le LCR par les villosités arachnoïdiennes. Une thrombose de sinus peut provoquer une hypertension intracrânienne avec lésions irréversibles.",src:"Système lymphatique et vasculaire cou et crâne2.pptx"},
 {id:"s3an11",th:"manip",course:true,ue:"anatomie",e:"📍",t:"Repères des sinus et des carotides",b:"Sinus caverneux : selle turcique, hypophyse, artère carotide. Sinus sagittal supérieur : suture sagittale, faux du cerveau, vers le confluent. Carotide commune : repère en C4.",src:"support cours.odt"},
 {id:"s3an12",th:"manip",course:true,ue:"anatomie",e:"🧬",t:"Le crâne presque sans lymphatiques",b:"Très faible présence de lymphatiques, et même absence de ganglions, en partie à cause de la barrière hémato-encéphalique. Nouveauté : la SLYM, membrane sous-arachnoïdienne de type lymphatique, barrière et surveillance immunitaire. Système glymphatique découvert en 2012, vaisseaux lymphatiques méningés en 2015.",src:"Système lymphatique et vasculaire cou et crâne2.pptx"},
 {id:"s3an13",th:"manip",course:true,ue:"anatomie",e:"🔎",t:"Ganglions du cou : les enjeux en imagerie",b:"Reconnaître un ganglion pathologique au scanner ou en IRM : taille, forme, nécrose. Délinéer les aires ganglionnaires dans un cancer ORL. Appliquer la classification TNM.",src:"Système lymphatique et vasculaire cou et crâne2.pptx"},
 {id:"s3an14",th:"manip",course:true,ue:"anatomie",e:"🚨",t:"« Le pire mal de tête de sa vie »",b:"Céphalée brutale et extrême, raideur de nuque, nausées, photophobie : drapeau rouge d’hémorragie sous-arachnoïdienne. Le plus souvent par rupture d’un anévrisme cérébral. C’est une urgence vitale.",src:"Système lymphatique et vasculaire cou et crâne2.pptx"},
 {id:"s3an15",th:"manip",course:true,ue:"anatomie",e:"📐",t:"La ligne orbito-méatale (LOM)",b:"C’est l’axe de référence à tracer sur le patient. À ne pas confondre avec le plan de Frankfort (Virchow).",src:"ARCHITECTURE OSTEO ARTICULAIRE crane cervicales.pptx"},
 {id:"s3an16",th:"manip",course:true,ue:"anatomie",e:"🗺️",t:"Les trois fosses crâniennes et leur intérêt",b:"Antérieure : fenêtrage TDM osseux fin pour une brèche méningée (rhinorrhée cérébrospinale). Moyenne : selle turcique et hypophyse, canal optique (II), fissure orbitaire supérieure, foramens ovale et rond (V). Postérieure : cervelet, exploration en IRM.",src:"ARCHITECTURE OSTEO ARTICULAIRE crane cervicales.pptx"},
 {id:"s3an17",th:"manip",course:true,ue:"anatomie",e:"👶",t:"Sutures, fontanelles et échographie transfontanellaire",b:"Le crâne du nouveau-né n’est pas soudé à la naissance. L’échographie transfontanellaire n’est plus possible après 18 mois. Quand une suture se ferme trop tôt, la croissance perpendiculaire à cette suture est freinée.",src:"ARCHITECTURE OSTEO ARTICULAIRE crane cervicales.pptx"}
];

 {id:"s3an18",th:"manip",course:true,ue:"anatomie",e:"🗺️",t:"Base du crâne : repère les trois fosses",b:"1 = fosse crânienne antérieure, 2 = moyenne, 3 = postérieure. La moyenne loge l’hypophyse dans la selle turcique. La postérieure loge le cervelet et s’explore en IRM.",src:"ARCHITECTURE OSTEO ARTICULAIRE crane cervicales.pptx",img:SCH.fosses},
 {id:"s3an19",th:"manip",course:true,ue:"anatomie",e:"👶",t:"Loi de Virchow : les craniosténoses",b:"La croissance perpendiculaire à la suture touchée est freinée. Autour de la normocéphalie : scaphocéphalie, trigonocéphalie, brachycéphalie. Et les plagiocéphalies antérieure et postérieure (pachycéphalie).",src:"ARCHITECTURE OSTEO ARTICULAIRE crane cervicales.pptx",img:SCH.virchow},
 {id:"s3an20",th:"manip",course:true,ue:"anatomie",e:"👃",t:"Les sinus de la face",b:"Sinus frontal, sinus ethmoïdal, sinus maxillaire, et sinus sphénoïdal en arrière. Le massif facial est creusé de cavités remplies d’air plutôt que d’être un bloc osseux plein.",src:"ARCHITECTURE OSTEO ARTICULAIRE crane cervicales.pptx",img:SCH.sinus},
 {id:"s3an21",th:"manip",course:true,ue:"anatomie",e:"🙆",t:"Charnière C0-C1 : le mouvement du « oui »",b:"Les condyles occipitaux reposent sur les cavités glénoïdes de C1 : c’est l’articulation atlanto-occipitale. Mouvement de flexion / extension, « faire OUI ». On vérifie la congruence condyles-C1 sur reconstruction coronale.",src:"ARCHITECTURE OSTEO ARTICULAIRE crane cervicales.pptx"},
 {id:"s3an22",th:"manip",course:true,ue:"anatomie",e:"🙅",t:"Complexe C1-C2 : le mouvement du « non »",b:"La dent de l’axis (C2) pivote contre l’arc antérieur de C1, maintenue par le puissant ligament transverse de l’atlas. Rotation axiale : 50 % de la rotation cervicale, « faire NON ». Espace atloïdo-odontoïdien antérieur < 3 mm chez l’adulte, < 5 mm chez l’enfant, sur cliché bouche ouverte.",src:"ARCHITECTURE OSTEO ARTICULAIRE crane cervicales.pptx"},
 {id:"s3an23",th:"manip",course:true,ue:"anatomie",e:"💥",t:"Fracture de Jefferson : l’écartement des masses latérales",b:"Sur le complexe C1-C2, un écartement des masses latérales > 7 mm signe une fracture de Jefferson. Un épaississement des parties molles rétro-pharyngées > 7 mm en C2 est un signe indirect de fracture du rachis.",src:"ARCHITECTURE OSTEO ARTICULAIRE crane cervicales.pptx"},
 {id:"s3an24",th:"manip",course:true,ue:"anatomie",e:"🦴",t:"Rachis subaxial C3-C7 : ce qui le caractérise",b:"Corps à crochets (uncus), foramen transversaire où passe l’artère vertébrale, épineuse bifide. Mouvements de flexion / extension, inclinaison et rotation. Le foramen transversaire est la signature des vertèbres cervicales.",src:"ARCHITECTURE OSTEO ARTICULAIRE crane cervicales.pptx"},
 {id:"s3an25",th:"manip",course:true,ue:"anatomie",e:"📏",t:"Stabilité cervicale : les 4 lignes et Swischuk",b:"Sur le profil, les 4 lignes longitudinales doivent rester continues (sinon pseudospondylolisthésis). La ligne de Swischuk va de l’arc postérieur de C1 à celui de C3 et passe à ≤ 1 mm de l’arc de C2. Disques (nucleus + annulus), LLA, LLP, ligaments jaunes et nuchal assurent la protection médullaire.",src:"ARCHITECTURE OSTEO ARTICULAIRE crane cervicales.pptx"},

 {id:"s3ph40",th:"manip",course:true,ue:"physio",e:"🧠",t:"Sténose carotidienne : souvent silencieuse",b:"C’est le rétrécissement de la lumière de l’artère carotide par une plaque d’athérome. Le plus souvent asymptomatique ; signes d’alerte : perte brutale ou progressive de la vue, paralysie d’un hémicorps, aphasie. Une migration de débris de plaque peut provoquer un AVC.",src:"Pathologie sténose carotidienne.pdf"},

const iso = d => d.toISOString().slice(0,10);

const addDays = n => iso(new Date(Date.now()+n*864e5));
const store = {get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let liked=store.get("su3-liked",[]), saved=store.get("su3-saved",[]), flagged=store.get("su3-flag",[]), gen=store.get("su3-gen",[]);

if(stats.day!==today){const y=addDays(-1);stats.streak=(stats.day===y&&stats.seen.length)?stats.streak:0;stats.day=today;stats.seen=[];store.set("su3-stats",stats)}

const byId=id=>allCards().find(c=>c.id===id);

function rng(seed){let h=0;for(const c of seed)h=Math.imul(31,h)+c.charCodeAt(0)|0;return()=>{h=h+0x6D2B79F5|0;let t=Math.imul(h^h>>>15,1|h);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,s){const r=rng(s),b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function weight(th){const l=liked.filter(id=>{const c=byId(id);return c&&c.th===th}).length;return 1+0.35*l+Math.min(3,(dwell[th]||0)/120)}
function wshuffle(a,s){const r=rng(s);return a.map(c=>({c,k:-Math.log(r()+1e-9)/weight(c.th)})).sort((x,y)=>x.k-y.k).map(x=>x.c)}

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
function axes(c,x0,y0,x1,y1){c.strokeStyle="#FFFFFF55";c.lineWidth=1.5;c.beginPath();c.moveTo(x0,y0);c.lineTo(x0,y1);c.lineTo(x1,y1);c.stroke()}
function curve(c,fn,x0,y0,x1,y1,p,col,lw=3){c.strokeStyle=col;c.lineWidth=lw;c.beginPath();const n=80;for(let i=0;i<=n*p;i++){const u=i/n;const x=x0+u*(x1-x0),y=y1-fn(u)*(y1-y0);i?c.lineTo(x,y):c.moveTo(x,y)}c.stroke()}
function label(c,t,x,y,col="#F6F3EE",s=13,al="left"){c.fillStyle=col;c.font=F(s);c.textAlign=al;c.fillText(t,x,y)}
function court(c,w,h){const m=14,cw=w-2*m,ch=h-2*m;c.strokeStyle="#FFFFFF66";c.lineWidth=2;c.strokeRect(m,m,cw,ch);c.strokeStyle="#FFFFFFcc";c.lineWidth=3;c.beginPath();c.moveTo(w/2,m-6);c.lineTo(w/2,h-m+6);c.stroke();c.strokeStyle="#FFFFFF44";c.lineWidth=1.5;const d=cw/6;[w/2-d,w/2+d].forEach(x=>{c.beginPath();c.moveTo(x,m);c.lineTo(x,h-m);c.stroke()});return{m,cw,ch}}
function dot(c,x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,7);c.fill()}
function arrow(c,x0,y0,x1,y1,col,p=1,dash){c.strokeStyle=col;c.lineWidth=3;c.setLineDash(dash?[6,6]:[]);const x=x0+(x1-x0)*p,y=y0+(y1-y0)*p;c.beginPath();c.moveTo(x0,y0);c.lineTo(x,y);c.stroke();c.setLineDash([]);if(p>=1){const a=Math.atan2(y1-y0,x1-x0);c.fillStyle=col;c.beginPath();c.moveTo(x1,y1);c.lineTo(x1-12*Math.cos(a-.4),y1-12*Math.sin(a-.4));c.lineTo(x1-12*Math.cos(a+.4),y1-12*Math.sin(a+.4));c.fill()}}

VIZ.t1t2=(c,w,h,t,A)=>{const p=clamp((t%7)/4);const mid=w/2;

VIZ.aliasing=(c,w,h,t,A)=>{const ph=Math.floor((t%9)/3);const big=ph===2;const fw=big?w*.86:w*.56,fx=(w-fw)/2,fy=22,fh=h-50;

VIZ.generateur=(c,w,h,t,A)=>{const p=clamp((t%8)/5);const x0=26,y0=24,x1=w-12,y1=h-30;axes(c,x0,y0,x1,y1);

  curve(c,u=>{const tt=u*T,te=tt%24;return Math.exp(-lM*tt)*(lT/(lT-lM))*(1-Math.exp(-(lT-lM)*te))*.87},x0,y0,x1,y1,p,A,3);
  label(c,"Mo 99",x0+8,y0+10,"#9FB7FF",12);label(c,"Tc 99m",x0+8,y0+28,A,12);

VIZ.inverse=(c,w,h,t,A)=>{const sx=30,sy=h/2;dot(c,sx,sy,8,A);c.strokeStyle="#FFFFFF33";c.lineWidth=1.5;

VIZ.bolus=(c,w,h,t,A)=>{const x0=26,y0=20,x1=w-12,y1=h-30;axes(c,x0,y0,x1,y1);const T=110,ts=(t*14)%T,p=ts/T;
  const ao=u=>{const s=u*T;return s<12?0:.95*Math.pow((s-12)/16,2)*Math.exp(2*(1-(s-12)/16))*0.9};const li=u=>{const s=u*T;return s<20?0:.38*Math.pow((s-20)/50,2)*Math.exp(2*(1-(s-20)/50))};
