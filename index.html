VIZ.seam=(c,w,h,t,A)=>{const {m}=court(c,w,h);const p=clamp((t%4)/2.2);const hx=w*.32,hy=h*.55;
  dot(c,hx,hy,10,"#FFB066");c.fillStyle="#9FB7FF";c.fillRect(w/2+2,h*.22,12,46);c.fillRect(w/2+2,h*.55,12,46);
  const gy=h*.47;arrow(c,hx,hy,w-m-30,gy-6,A,p);if(p>=1)label(c,"frappe dans le trou entre les contreurs",w/2,h-2,A,12,"center")};

VIZ.angle=(c,w,h,t,A)=>{const {m,cw}=court(c,w,h);const p=clamp((t%4)/2.2);const hx=w/2-20,hy=h-m-14;
  dot(c,hx,hy,10,"#FFB066");arrow(c,hx,hy,w/2+cw/6+6,h-m-6,A,p);arrow(c,hx,hy,w-m-10,m+20,"#FFFFFF55",1,true);
  label(c,"angle court",w/2+cw/6+10,h-m-16,A,12);label(c,"diagonale longue",w-m-14,m+40,"#FFFFFF88",11,"right")};

VIZ.flottant=(c,w,h,t,A)=>{const p=clamp((t%4)/3);c.strokeStyle="#FFFFFFcc";c.lineWidth=3;c.beginPath();c.moveTo(w/2,h-30);c.lineTo(w/2,h*.38);c.stroke();
  c.strokeStyle=A;c.lineWidth=2.5;c.beginPath();for(let i=0;i<=100*p;i++){const u=i/100;const x=20+u*(w-40);const y=h-40-Math.sin(u*Math.PI)*(h*.55)+Math.sin(u*22)*u*u*14;i?c.lineTo(x,y):c.moveTo(x,y)}c.stroke();
  label(c,"la trajectoire bouge surtout en fin de course",w/2,h-8,"#FFFFFF99",11,"center")};

VIZ.transition=(c,w,h,t,A)=>{const m=14;c.strokeStyle="#FFFFFF66";c.lineWidth=2;c.strokeRect(m,m,w-2*m,h-2*m);c.strokeStyle="#FFFFFFcc";c.lineWidth=3;c.beginPath();c.moveTo(m-6,m);c.lineTo(w-m+6,m);c.stroke();
  c.strokeStyle="#FFFFFF44";c.lineWidth=1.5;const y3=m+(h-2*m)*.36;c.beginPath();c.moveTo(m,y3);c.lineTo(w-m,y3);c.stroke();label(c,"filet",w/2,m-2,"#FFFFFFaa",10,"center");
  const P=[[w*.2,m+14],[w*.06,y3+26],[w*.2,m+14]];const k=(t%5)/2.2;
  if(k<1){arrow(c,P[0][0],P[0][1],P[1][0],P[1][1],A,clamp(k),true);dot(c,P[0][0]+(P[1][0]-P[0][0])*clamp(k),P[0][1]+(P[1][1]-P[0][1])*clamp(k),9,"#FFB066")}
  else{arrow(c,P[0][0],P[0][1],P[1][0],P[1][1],"#FFFFFF55",1,true);const u=clamp(k-1);arrow(c,P[1][0],P[1][1],w*.24,m+20,A,u);dot(c,P[1][0]+(w*.24-P[1][0])*u,P[1][1]+(m+20-P[1][1])*u,9,"#FFB066")}
  label(c,"1. recule en diagonale, face au jeu",w*.38,y3+10,"#FFFFFFcc",11);label(c,"2. élan complet vers le filet",w*.38,y3+30,A,11)};

function vizCanvas(key,acc){const cv=document.createElement("canvas");cv.className="viz";cv.dataset.viz=key;cv.dataset.a=acc;cv.setAttribute("aria-hidden","true");vizEls.add(cv);vizObs.observe(cv);return cv}
const vizObs=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting?visible.add(e.target):visible.delete(e.target)),{root:feed,threshold:.2});
let t0=performance.now();
function loop(now){visible.forEach(cv=>{if(!cv.isConnected){visible.delete(cv);return}const r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);const W=Math.round(r.width*dpr),H=Math.round(r.height*dpr);if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
  const c=cv.getContext("2d");c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,r.width,r.height);try{VIZ[cv.dataset.viz](c,r.width,r.height,RM?6:(now-t0)/1000,cv.dataset.a)}catch(e){}});requestAnimationFrame(loop)}
requestAnimationFrame(loop);

// ======================= cartes
const ICON={like:'<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-9.2-8.6C1.2 8.2 3.1 4.5 6.6 4.5c2 0 3.4 1.1 4.4 2.6 1-1.5 2.4-2.6 4.4-2.6 3.5 0 5.4 3.7 3.8 6.9C19 15.6 12 20 12 20z"/></svg>',save:'<svg viewBox="0 0 24 24"><path d="M6 3.5h12v17l-6-4-6 4z"/></svg>',share:'<svg viewBox="0 0 24 24"><path d="M4 12v7h16v-7M12 3v12M7.5 7.5 12 3l4.5 4.5"/></svg>',list:'<svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg>',flag:'<svg viewBox="0 0 24 24"><path d="M5 21V4h11l-2 4 2 4H5"/></svg>'};
function themeVars(el,th){const T=THEMES[th];el.style.setProperty("--g1",T.g[0]);el.style.setProperty("--g2",T.g[1]);el.style.setProperty("--a",T.a)}
function rail(c){const r=document.createElement("div");r.className="rail";
  r.innerHTML=`<button class="rbtn like" aria-pressed="${liked.includes(c.id)}"><span class="ic">${ICON.like}</span>J’aime</button>
  <button class="rbtn save" aria-pressed="${saved.includes(c.id)}"><span class="ic">${ICON.save}</span>Garder</button>
  <button class="rbtn share"><span class="ic">${ICON.share}</span>Partager</button>
  <button class="rbtn flag" aria-pressed="${flagged.includes(c.id)}"><span class="ic">${ICON.flag}</span>Erreur ?</button>
  <button class="rbtn lst"><span class="ic">${ICON.list}</span>Ma liste</button>`;
  r.querySelector(".like").onclick=e=>toggle("like",c.id);r.querySelector(".save").onclick=()=>toggle("save",c.id);
  r.querySelector(".flag").onclick=()=>toggle("flag",c.id);r.querySelector(".share").onclick=()=>share(c);r.querySelector(".lst").onclick=()=>openList("saved");return r}
function meta(c,extra=""){const T=THEMES[c.th];const u=c.ue?` · ${UES[c.ue]}`:"";return `<div class="meta"><span>${T.e}</span><b>${T.label}${u}</b>${c.ai?'<span class="tag-ai">✨ Claude</span>':""}${extra}</div>`}
function fillBody(box,c){
  const h=document.createElement("h2");h.textContent=c.t;const p=document.createElement("p");p.className="body";p.textContent=c.b;box.append(h,p);
  if(c.steps&&c.steps.length){const ol=document.createElement("ol");ol.className="steps";c.steps.forEach(s=>{const li=document.createElement("li");li.textContent=s;ol.appendChild(li)});box.appendChild(ol)}
  if(c.src){const s=document.createElement("p");s.className="src";s.textContent="Source : "+c.src;box.appendChild(s)}}
function learnRow(c){const row=document.createElement("div");row.className="learn";const st=S[c.id]&&S[c.id].s;
  row.innerHTML=`<button class="lb known">Je savais déjà</button><button class="lb learnb ${st==="learn"?"on":""}">${st==="learn"?"✓ En révision":"Appris !"}</button>`;
  row.querySelector(".known").onclick=()=>{S[c.id]={s:"known"};saveS();toast("Elle ne reviendra plus");row.querySelectorAll("button").forEach(b=>b.disabled=true)};
  row.querySelector(".learnb").onclick=e=>{if(S[c.id]&&S[c.id].s==="learn")return;S[c.id]={s:"learn",n:0,due:addDays(INTERVALS[0])};saveS();e.currentTarget.classList.add("on");e.currentTarget.textContent="✓ En révision";toast("Elle reviendra demain en révision")};
  return row}
function cardEl(c){const el=document.createElement("section");el.className="card";el.dataset.id=c.id;el.dataset.th=c.th;themeVars(el,c.th);
  el.innerHTML=`<div class="content"></div>${meta(c)}`;const box=el.querySelector(".content");
  if(c.img){const im=document.createElement("img");im.className="schema";im.src=c.img;im.alt="Schéma : "+c.t;im.loading="lazy";box.appendChild(im)}else if(c.viz&&VIZ[c.viz])box.appendChild(vizCanvas(c.viz,THEMES[c.th].a));else{const e=document.createElement("div");e.className="emoji";e.textContent=c.e||THEMES[c.th].e;box.appendChild(e)}
  fillBody(box,c);box.appendChild(learnRow(c));el.appendChild(rail(c));
  let last=0;el.addEventListener("click",ev=>{if(ev.target.closest("button"))return;const n=Date.now();if(n-last<300){if(!liked.includes(c.id))toggle("like",c.id);heartBurst(el,ev.clientX,ev.clientY)}last=n});
  return el}
function reviewEl(c){const el=document.createElement("section");el.className="card rv";el.dataset.id="rv-"+c.id;el.dataset.th=c.th;themeVars(el,c.th);
  el.innerHTML=`<div class="content"><span class="rv-label">🔁 Révision</span><div class="emoji">${c.e||THEMES[c.th].e}</div><h2></h2><p class="body">Tu te souviens de l’explication ? Essaie de la dire dans ta tête avant de regarder.</p><button class="big show">Voir la réponse</button><div class="reveal" hidden></div><div class="learn ans" hidden><button class="lb yes">Je m’en souvenais</button><button class="lb no">J’avais oublié</button></div></div>${meta(c)}`;
  el.querySelector("h2").textContent=c.t;const rv=el.querySelector(".reveal");
  el.querySelector(".show").onclick=e=>{e.currentTarget.remove();el.querySelector(".body").remove();el.querySelector(".emoji").remove();if(c.viz&&VIZ[c.viz])rv.appendChild(vizCanvas(c.viz,THEMES[c.th].a));const p=document.createElement("p");p.className="body";p.textContent=c.b;rv.appendChild(p);
    if(c.steps){const ol=document.createElement("ol");ol.className="steps";c.steps.forEach(s=>{const li=document.createElement("li");li.textContent=s;ol.appendChild(li)});rv.appendChild(ol)}rv.hidden=false;el.querySelector(".ans").hidden=false};
  el.querySelector(".yes").onclick=()=>{const n=(S[c.id].n||0)+1;if(n>=INTERVALS.length){S[c.id]={s:"done"};toast("Maîtrisée 🎉")}else{S[c.id]={s:"learn",n,due:addDays(INTERVALS[n])};toast(`Prochaine révision dans ${INTERVALS[n]} jours`)}saveS();el.querySelectorAll(".ans button").forEach(b=>b.disabled=true)};
  el.querySelector(".no").onclick=()=>{S[c.id]={s:"learn",n:0,due:addDays(1)};saveS();toast("Elle revient demain");el.querySelectorAll(".ans button").forEach(b=>b.disabled=true)};
  return el}
function quizEl(q){const el=document.createElement("section");el.className="card";el.dataset.id=q.id;el.dataset.th=q.th;themeVars(el,q.th);
  el.innerHTML=`<div class="content"><div class="emoji">❓</div><h2></h2><div class="opts"></div><p class="ex" hidden></p></div>${meta({th:q.th,ue:q.ue},"")}`;
  el.querySelector("h2").textContent=q.q;const box=el.querySelector(".opts"),ex=el.querySelector(".ex");
  q.o.forEach((t,i)=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>{box.querySelectorAll(".opt").forEach((o,j)=>{o.disabled=true;if(j===q.a)o.classList.add("good")});if(i!==q.a)b.classList.add("bad");ex.textContent=(i===q.a?"Bien joué. ":"Raté. ")+q.x;ex.hidden=false};box.appendChild(b)});
  return el}
function pauseEl(){const el=document.createElement("section");el.className="card";el.style.setProperty("--g1","#22252F");el.style.setProperty("--g2","#0B0C10");
  const lbl=theme==="rev"?(ue==="all"?"Manip":UES[ue]):theme==="all"?"":THEMES[theme].label;
  el.innerHTML=`<div class="content"><div class="emoji">🌿</div><h2>Petite pause ?</h2><p class="body">Tu as vu <b>${stats.seen.length}</b> carte${stats.seen.length>1?"s":""} aujourd’hui. Bon moment pour lever les yeux. Si tu veux continuer, c’est toi qui décides.</p>
  <div>${shown<queue.length?'<button class="big more">Continuer</button>':""}${sample?`<button class="ghost gen">✨ 5 nouvelles cartes${lbl?" "+lbl:""}</button>`:""}</div>${shown>=queue.length?'<p class="status">Tu as tout vu ici pour l’instant.</p>':'<p class="status"></p>'}</div>`;
  const m=el.querySelector(".more");if(m)m.onclick=()=>{el.remove();append()};const g=el.querySelector(".gen");if(g)g.onclick=()=>generate(el);return el}

// ======================= construction du fil
function filt(c){if(theme==="rev")return c.th==="manip"&&(ue==="all"||c.ue===ue);return theme==="all"||c.th===theme}
function build(){
  feed.innerHTML="";shown=0;const seed=today+theme+ue;
  const pool=allCards().filter(filt).filter(c=>!S[c.id]||S[c.id].s==="learn");
  const due=pool.filter(c=>S[c.id]&&S[c.id].s==="learn"&&S[c.id].due<=today);
  const rest=pool.filter(c=>!due.includes(c));
  const fresh=rest.filter(c=>!seenEver.has(c.id)),old=rest.filter(c=>seenEver.has(c.id));
  const order=(theme==="all"?wshuffle(fresh,seed):shuffle(fresh,seed)).concat(shuffle(old,seed+"o"));
  const qs=shuffle(QUIZ.filter(filt),seed+"q");
  queue=[];let di=0,qi=0;
  if(theme==="rev"&&due.length){due.slice(0,3).forEach(c=>queue.push({k:"r",d:c}));di=3}
  order.forEach((c,i)=>{queue.push({k:"c",d:c});if((i+1)%4===0&&di<due.length)queue.push({k:"r",d:due[di++]});if((i+1)%6===0&&qi<qs.length)queue.push({k:"q",d:qs[qi++]})});
  while(di<due.length)queue.push({k:"r",d:due[di++]});
  append();feed.scrollTop=0;renderStat();
}
function append(){let n=0;while(shown<queue.length&&n<SESSION){const it=queue[shown++];const el=it.k==="c"?cardEl(it.d):it.k==="r"?reviewEl(it.d):quizEl(it.d);feed.appendChild(el);obs.observe(el);n++}feed.appendChild(pauseEl())}

async function generate(pc){const st=pc.querySelector(".status"),btn=pc.querySelector(".gen");btn.disabled=true;st.textContent="Claude prépare tes cartes… (jusqu’à une minute)";
  const th=theme==="rev"?"manip":theme==="all"?Object.keys(THEMES).sort((a,b)=>weight(b)-weight(a))[Math.floor(Math.random()*2)]:theme;
  const sub=theme==="rev"&&ue!=="all"?` Matière précise : ${UES[ue]}.`:"";
  const titles=allCards().filter(c=>c.th===th).map(c=>c.t).join(" | ");
  const prompt=`Tu écris des cartes pour une appli de scroll éducatif façon TikTok, en français, pour un étudiant manipulateur en électroradiologie médicale qui joue au volley en compétition.
Thème : ${THEMES[th].desc}.${sub}
Écris 5 cartes NOUVELLES, différentes de celles-ci : ${titles}
Niveau : intermédiaire à avancé. Interdit : les évidences et bases que tout le monde connaît. Chaque carte doit apprendre quelque chose de concret, précis ou peu connu.
Règles : informations exactes et vérifiables uniquement (si tu n’es pas sûr, choisis un autre sujet) ; ton direct, tutoiement ; titre accrocheur de 12 mots max ; texte de 2 à 3 phrases courtes ; apostrophe typographique ’ ; 1 emoji par carte ; "steps" facultatif (3 à 4 étapes courtes) pour une méthode ; "src" facultatif : source courte et réelle (recommandation, auteur et année) seulement si tu en es certain.
Réponds UNIQUEMENT avec un tableau JSON : [{"e":"emoji","t":"titre","b":"texte","steps":["..."],"src":"..."}]`;
  try{const data=await sample.json(prompt,{modelTier:"default"});
    const arr=(Array.isArray(data)?data:[]).filter(x=>x&&x.t&&x.b).slice(0,5).map((x,i)=>({id:"g"+Date.now()+i,th,ue:theme==="rev"&&ue!=="all"?ue:undefined,e:String(x.e||THEMES[th].e).slice(0,4),t:String(x.t),b:String(x.b),steps:Array.isArray(x.steps)&&x.steps.length?x.steps.slice(0,4).map(String):undefined,src:x.src?String(x.src):undefined,ai:true}));
    if(!arr.length)throw{code:"empty"};gen=gen.concat(arr).slice(-300);store.set("su3-gen",gen);
    pc.remove();arr.forEach(c=>{const el=cardEl(c);feed.appendChild(el);obs.observe(el)});feed.appendChild(pauseEl());toast("5 nouvelles cartes ajoutées");
  }catch(e){btn.disabled=false;st.textContent=e&&e.code==="not_granted"?"Génération non autorisée. Les cartes prêtes restent disponibles.":e&&e.code==="rate_limited"?"Trop de demandes d’un coup. Réessaie dans un moment.":"La génération n’a pas abouti. Réessaie avec le bouton."}}

// ======================= suivi
const enter=new Map();
const obs=new IntersectionObserver(es=>es.forEach(e=>{const el=e.target,id=el.dataset.id,th=el.dataset.th;
  if(e.isIntersecting){enter.set(el,Date.now());if(id&&!stats.seen.includes(id)){if(!stats.seen.length)stats.streak+=1;stats.seen.push(id);store.set("su3-stats",stats);renderStat()}if(id&&!id.startsWith("rv-")){seenEver.add(id);store.set("su3-seen",[...seenEver].slice(-2000))}}
  else if(enter.has(el)&&th){const s=Math.min(30,(Date.now()-enter.get(el))/1000);enter.delete(el);dwell[th]=(dwell[th]||0)+s;store.set("su3-dwell",dwell)}}),{root:feed,threshold:.6});

function toggle(kind,id){const map={like:["su3-liked",()=>liked,v=>liked=v],save:["su3-saved",()=>saved,v=>saved=v],flag:["su3-flag",()=>flagged,v=>flagged=v]}[kind];
  let arr=map[1]();arr=arr.includes(id)?arr.filter(x=>x!==id):arr.concat(id);map[2](arr);store.set(map[0],arr);const on=arr.includes(id);
  if(kind==="save")toast(on?"Ajoutée à ta liste":"Retirée de ta liste");if(kind==="flag")toast(on?"Signalée : retrouve-la dans Ma liste":"Signalement retiré");
  document.querySelectorAll(`.card[data-id="${id}"] .${kind}`).forEach(b=>b.setAttribute("aria-pressed",on))}
function heartBurst(el,x,y){const r=el.getBoundingClientRect();const h=document.createElement("div");h.className="burst";h.textContent="❤️";h.style.left=(x-r.left)+"px";h.style.top=(y-r.top)+"px";el.appendChild(h);requestAnimationFrame(()=>h.classList.add("go"));setTimeout(()=>h.remove(),800)}
async function share(c){const text=`${c.t}\n\n${c.b}`;try{if(navigator.share){await navigator.share({title:c.t,text});return}}catch(e){return}try{await navigator.clipboard.writeText(text);toast("Texte copié")}catch(e){toast("Copie impossible ici")}}
let tt;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),1700)}
function renderStat(){const due=Object.values(S).filter(s=>s.s==="learn"&&s.due<=today).length;document.getElementById("stat").innerHTML=`<b>${stats.seen.length}</b> vues${stats.streak>0?` · 🔥 ${stats.streak}`:""}${due?` · 🔁 ${due}`:""}`}

// ======================= ma liste
const dlg=document.getElementById("dlg"),dtabs=document.getElementById("dtabs");let ltab="saved";
function openList(tab){ltab=tab||ltab;dtabs.innerHTML="";[["saved","Gardées"],["prog","Progrès"],["flag","Signalées"]].forEach(([k,l])=>{const b=document.createElement("button");b.className="dtab";b.textContent=l;b.setAttribute("aria-pressed",k===ltab);b.onclick=()=>openList(k);dtabs.appendChild(b)});
  const list=document.getElementById("list");list.innerHTML="";
  const items=ids=>ids.map(byId).filter(Boolean).forEach(c=>{const d=document.createElement("div");d.className="item";d.innerHTML=`<h4></h4><p></p>`;d.querySelector("h4").textContent=(c.e||"")+" "+c.t;d.querySelector("p").textContent=c.b;list.appendChild(d)});

    list.innerHTML=`<div class="prog"><div><b>${cnt("learn")}</b>en révision</div><div><b>${due}</b>à revoir aujourd’hui</div><div><b>${cnt("done")}</b>maîtrisées</div><div><b>${cnt("known")}</b>déjà sues</div></div><p style="opacity:.75;font-size:.9rem;line-height:1.45">Les cartes marquées « Appris ! » reviennent à J+1, J+3, J+7, J+15, J+30 puis J+60. Retrouve-les dans l’onglet 📚 Révision ou mélangées dans ton fil.</p>`}
  if(ltab==="flag"){if(!flagged.length){list.innerHTML=`<p style="opacity:.75">Si une carte te semble fausse, appuie sur « Erreur ? ». Elle apparaîtra ici pour que tu puisses l’envoyer à Claude.</p>`}else{const b=document.createElement("button");b.className="copy";b.textContent="Copier pour envoyer à Claude";b.onclick=async()=>{const txt="Cartes à vérifier dans Scroll utile :\n\n"+flagged.map(byId).filter(Boolean).map(c=>`- ${c.t} : ${c.b}`).join("\n");try{await navigator.clipboard.writeText(txt);toast("Copié")}catch(e){toast("Copie impossible ici")}};list.appendChild(b);items(flagged)}}
  if(!dlg.open)dlg.showModal()}
document.getElementById("close").onclick=()=>dlg.close();dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});

// ======================= onglets
const tabs=document.getElementById("tabs"),subtabs=document.getElementById("subtabs");
[["all","Pour toi"],["rev","📚 Révision"],...Object.entries(THEMES).map(([k,v])=>[k,v.e+" "+v.label])].forEach(([k,l])=>{const b=document.createElement("button");b.className="tab";b.textContent=l;b.setAttribute("aria-pressed",k===theme);
  b.onclick=()=>{theme=k;ue="all";tabs.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-pressed",x===b));renderSub();build()};tabs.appendChild(b)});
function renderSub(){subtabs.hidden=theme!=="rev";subtabs.innerHTML="";if(theme!=="rev")return;[["all","Toutes"],...Object.entries(UES)].forEach(([k,l])=>{const b=document.createElement("button");b.className="sub";b.textContent=l;b.setAttribute("aria-pressed",k===ue);b.onclick=()=>{ue=k;renderSub();build()};subtabs.appendChild(b)})}

renderStat();build();
(async()=>{try{const s=await window.claude?.use?.("sample");if(s){sample=s;const last=feed.lastElementChild;if(last&&!last.dataset.id)last.replaceWith(pauseEl())}}catch(e){}})();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
