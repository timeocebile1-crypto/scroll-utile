<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scroll utile</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#07080C">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
  --bg:#07080C; --ink:#F6F3EE; --soft:#C9C4BC; --chip:#FFFFFF1F; --chip-on:#F6F3EE; --chip-on-ink:#07080C;
  --sheet:#15171E; --line:#FFFFFF1A; --good:#7EE2A8; --bad:#FF8E8E;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){ --bg:#07080C; --sheet:#F7F4EE; --sheet-ink:#15171E; }
}
:root[data-theme="light"]{ --sheet:#F7F4EE; --sheet-ink:#15171E; }
:root[data-theme="dark"]{ --bg:#07080C; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;position:relative}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#07080C}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

#feed{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.card{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;
  background:radial-gradient(120% 80% at 20% 15%, var(--g1) 0%, var(--g2) 70%);display:flex;align-items:safe center}
.card::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(transparent,#0008);pointer-events:none}
.content{position:relative;z-index:1;padding:7.2rem 5.2rem 5.5rem 1.4rem;max-width:40rem;width:100%}
.emoji{font-size:clamp(3.5rem,16vw,5.5rem);line-height:1;margin-bottom:1.2rem;display:inline-grid;place-items:center;
  width:1.6em;height:1.6em;border-radius:50%;background:#FFFFFF14;border:1px solid #FFFFFF22}
.card h2{font-size:clamp(1.75rem,7.2vw,2.6rem);line-height:1.06;letter-spacing:-.025em;font-weight:800;margin:0 0 1rem;text-wrap:balance}
.card p.body{font-size:1.08rem;line-height:1.55;margin:0;color:#F2EEE8;max-width:58ch}
.steps{list-style:none;padding:0;margin:1.2rem 0 0;display:grid;gap:.55rem;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:.7rem;align-items:flex-start;font-size:1rem;line-height:1.4;background:#FFFFFF10;border-radius:14px;padding:.6rem .8rem}
.steps li::before{content:counter(s);flex:none;width:1.6rem;height:1.6rem;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.9rem;background:var(--a);color:#111}
.meta{position:absolute;left:1.4rem;right:5rem;bottom:1.4rem;z-index:2;font-size:.95rem;color:var(--soft);display:flex;gap:.5rem;align-items:center}
.meta b{color:var(--ink);font-weight:600}
.tag-ai{font-size:.8rem;background:#FFFFFF22;border-radius:999px;padding:.15rem .55rem;color:var(--ink)}

/*r*/.rail{position:absolute;right:.7rem;bottom:4.2rem;z-index:3;display:flex;flex-direction:column;gap:1.1rem;align-items:center}
.rbtn{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:.2rem;cursor:pointer;font-size:.78rem;font-weight:600;color:var(--ink)}
.rbtn .ic{width:3rem;height:3rem;border-radius:50%;display:grid;place-items:center;background:#0000002e;backdrop-filter:blur(6px)}
.rbtn svg{width:1.7rem;height:1.7rem;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rbtn[aria-pressed="true"].like svg{fill:#FF4D6D;stroke:#FF4D6D}
.rbtn[aria-pressed="true"].save svg{fill:#FFD866;stroke:#FFD866}
.burst{position:absolute;z-index:4;pointer-events:none;font-size:6rem;transform:translate(-50%,-50%) scale(.2);opacity:0}
@media (prefers-reduced-motion:no-preference){
  .burst.go{animation:burst .7s ease-out forwards}
  @keyframes burst{30%{transform:translate(-50%,-50%) scale(1.15);opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
}

header{position:absolute;top:0;left:0;right:0;z-index:5;padding:.6rem 0 .4rem;background:linear-gradient(#000a,transparent)}
.top{display:flex;justify-content:space-between;align-items:center;padding:0 1rem}
.brand{font-weight:800;font-size:1.15rem;letter-spacing:-.02em}
.stat{font-size:.85rem;color:var(--soft)}
.stat b{color:var(--ink)}
.tabs{display:flex;gap:.4rem;overflow-x:auto;padding:.55rem 1rem .2rem;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;border-radius:999px;padding:.38rem .8rem;font-size:.92rem;font-weight:600;background:var(--chip);cursor:pointer;white-space:nowrap;backdrop-filter:blur(6px)}
.tab[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}

.opts{display:grid;gap:.6rem;margin-top:1.3rem}
.opt{text-align:left;border:1.5px solid #FFFFFF40;background:#FFFFFF10;border-radius:16px;padding:.9rem 1rem;font-size:1.05rem;cursor:pointer}
.opt.good{border-color:var(--good);color:var(--good);font-weight:600}
.opt.bad{border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.ex{margin-top:1rem;color:#E8E3DA;line-height:1.5}
.big{border:0;background:var(--ink);color:#07080C;border-radius:999px;padding:.8rem 1.2rem;font-weight:700;cursor:pointer;margin-top:1.2rem;display:inline-block}
.ghost{border:1.5px solid #FFFFFF55;background:transparent;border-radius:999px;padding:.75rem 1.1rem;font-weight:600;cursor:pointer;margin:1rem .5rem 0 0}
.status{margin-top:1rem;color:var(--soft);font-size:.95rem;min-height:1.4em}

dialog{border:0;padding:0;background:var(--sheet,#15171E);color:var(--sheet-ink,#F6F3EE);width:min(36rem,100%);max-height:80vh;border-radius:22px}
dialog::backdrop{background:#000a}
.dh{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.2rem;border-bottom:1px solid #8884;position:sticky;top:0;background:inherit}
.dh h3{margin:0;font-size:1.15rem}
.dh button{border:0;background:#8883;border-radius:999px;padding:.4rem .8rem;cursor:pointer}
.list{padding:.4rem 1.2rem 1.2rem}
.item{padding:.85rem 0;border-bottom:1px solid #8883}
.item h4{margin:0 0 .3rem;font-size:1.02rem;line-height:1.25}
.item p{margin:0;opacity:.75;font-size:.93rem;line-height:1.45}
.item button{margin-top:.45rem;border:0;background:none;opacity:.7;text-decoration:underline;cursor:pointer;padding:0;font-size:.85rem}
.toast{position:absolute;left:50%;bottom:5rem;transform:translateX(-50%);z-index:9;background:#000c;color:#fff;border-radius:999px;padding:.55rem 1rem;font-size:.92rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

.schema{display:block;width:100%;max-height:220px;object-fit:contain;margin:0 0 1.1rem;border-radius:18px;background:#fff}
.viz{display:block;width:100%;height:210px;margin:0 0 1.1rem;border-radius:18px;background:#0000002a;border:1px solid #FFFFFF1c}
.src{font-size:.82rem;color:var(--soft);margin-top:.8rem}
.learn{display:flex;gap:.5rem;margin-top:1.3rem;flex-wrap:wrap}
.lb{border:1.5px solid #FFFFFF45;background:#FFFFFF12;border-radius:999px;padding:.55rem .95rem;font-weight:600;font-size:.92rem;cursor:pointer}
.lb.on{background:var(--a);color:#111;border-color:var(--a)}
.rv .content{padding-right:1.4rem}
.rv-label{display:table;font-size:.85rem;font-weight:700;background:var(--a);color:#111;border-radius:999px;padding:.2rem .65rem;margin-bottom:.9rem}
.reveal[hidden]{display:none}
.subtabs{display:flex;gap:.35rem;overflow-x:auto;padding:.35rem 1rem 0;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs[hidden]{display:none}
.sub{flex:none;border:1px solid #FFFFFF33;background:#0000004d;border-radius:999px;padding:.28rem .7rem;font-size:.82rem;cursor:pointer;white-space:nowrap}
.sub[aria-pressed="true"]{background:var(--ink);color:#07080C}
.rbtn[aria-pressed="true"].flag svg{stroke:#FF9F5A}
.dtabs{display:flex;gap:.4rem;padding:.6rem 1.2rem 0}
.dtab{border:0;background:#8882;border-radius:999px;padding:.35rem .8rem;cursor:pointer;font-size:.9rem}
.dtab[aria-pressed="true"]{background:#8886;font-weight:700}
.prog{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;padding:.4rem 0}
.prog div{background:#8881;border-radius:14px;padding:.8rem}
.prog b{display:block;font-size:1.6rem}
.copy{border:0;background:#8883;border-radius:999px;padding:.5rem .9rem;cursor:pointer;margin-top:.6rem}
.rail{gap:.85rem}
@media (max-height:740px){.viz{height:150px;margin-bottom:.8rem}.card h2{font-size:1.55rem}.card p.body{font-size:1rem}.content{padding-top:6.6rem}}
</style>
</head>
<body>
<header>
  <div class="top"><div class="brand">Scroll utile</div><div class="stat" id="stat"></div></div>
  <nav class="tabs" id="tabs" aria-label="Thèmes"></nav>
  <nav class="subtabs" id="subtabs" aria-label="Matières" hidden></nav>
</header>
<main id="feed" aria-live="polite"></main>
<div class="toast" id="toast" role="status"></div>
<dialog id="dlg"><div class="dh"><h3>Ma liste</h3><button id="close">Fermer</button></div><div class="dtabs" id="dtabs"></div><div class="list" id="list"></div></dialog>
<script>
const THEMES = {
  manip:{label:"Manip", e:"🩻", g:["#0E3B43","#081A22"], a:"#5FE0D0", desc:"imagerie médicale de niveau DTS IMRT 2e année : artefacts et paramètres IRM, physique et dose en scanner, temps d’injection, produits de contraste et recommandations, médecine nucléaire (traceurs, protocoles, contrôle qualité des MRP), ordres de grandeur de dose, sécurité IRM"},
  volley:{label:"Volley", e:"🏐", g:["#7A2E12","#2A0F08"], a:"#FFB066", desc:"volley-ball pour un réceptionneur-attaquant de niveau pré-régional : lecture du contre, gestion des ballons hors système, variations d’attaque, réception du flottant, transition, lecture au contre, tactique de service, prévention des blessures du volleyeur. Pas de règles de base"},
  humain:{label:"L’humain", e:"🫂", g:["#2B2560","#100D26"], a:"#B9A8FF", desc:"psychologie appliquée et utile : techniques concrètes issues de la recherche pour passer à l’action, gérer le stress, l’échec, les relations, la communication avec un patient ou un proche, les tournants de vie"},
  savoir:{label:"Savoir-faire", e:"🛠️", g:["#1F4A2C","#0A1A10"], a:"#9BE39F", desc:"savoir-faire concrets et non évidents : techniques de cuisine (science culinaire), sécurité alimentaire, dépannages domestiques, entretien, éviter les arnaques"},
  utile:{label:"Trucs utiles", e:"💡", g:["#5A4210","#1E1605"], a:"#FFD866", desc:"astuces utiles et peu connues pour un étudiant en France : méthodes d’apprentissage validées par la recherche, logement et droits du locataire, impôts et aides étudiantes, stage, organisation"}
};

const CARDS = [
 // ---------- MANIP
 {id:"am1",th:"manip",e:"🔁",t:"Repliement en IRM : 4 façons de s’en débarrasser",b:"Quand l’anatomie dépasse le champ de vue dans la direction de codage de phase, elle réapparaît de l’autre côté de l’image.",steps:["Agrandir le FOV","Activer le suréchantillonnage en phase (no phase wrap)","Inverser la direction de codage de phase","Poser des bandes de saturation sur ce qui dépasse"]},
 {id:"am2",th:"manip",e:"🔩",t:"Matériel métallique : réduire l’artefact de susceptibilité",b:"L’écho de gradient est la pire séquence avec du métal : il n’y a pas d’impulsion 180° pour rattraper le déphasage. Privilégie le spin écho rapide, augmente la bande passante, raccourcis le TE. Et à 1,5 T l’artefact est plus petit qu’à 3 T."},
 {id:"am3",th:"manip",e:"📐",t:"L’angle magique peut simuler une tendinopathie",b:"Un tendon orienté à environ 55° par rapport à B0 apparaît en hypersignal sur les séquences à TE court (T1, DP). Sur une séquence à TE long, le faux hypersignal disparaît : c’est le piège classique de l’épaule et de la cheville."},
 {id:"am4",th:"manip",e:"🌡️",t:"SAR : pourquoi la 3 T chauffe plus",b:"Le SAR augmente avec le carré du champ : à séquence égale, environ 4 fois plus à 3 T qu’à 1,5 T. Leviers : réduire l’angle de bascule des 180°, allonger le TR, diminuer le nombre de coupes ou l’ETL."},
 {id:"am5",th:"manip",e:"📉",t:"Diviser le bruit par 2 en scanner coûte 4 fois la dose",b:"Le bruit varie comme 1/√mAs. Pour le diviser par 2, il faut multiplier les mAs par 4. C’est pour ça qu’on accepte une image un peu bruitée quand elle reste diagnostique : c’est l’optimisation."},
 {id:"am6",th:"manip",e:"⚡",t:"Baisser les kV rend l’iode plus brillant",b:"L’atténuation de l’iode augmente quand l’énergie des photons se rapproche de son seuil K (33 keV). À 80-100 kV, le rehaussement est plus fort, ce qui permet de réduire la dose d’iode chez un patient mince."},
 {id:"am7",th:"manip",e:"⏱️",t:"Temps artériel, portal : les repères",b:"Temps artériel vers 25-35 s après le début de l’injection, portal vers 70 s. En bolus tracking, on place une ROI dans l’aorte et on déclenche à un seuil, souvent autour de 100-150 UH, plus un délai."},
 {id:"am8",th:"manip",e:"🦴",t:"Les stries entre les rochers : le durcissement du faisceau",b:"En traversant de l’os dense, le faisceau perd ses photons de basse énergie et devient plus « dur ». Le logiciel interprète mal ce changement et crée des bandes sombres, typiques de la fosse postérieure."},
 {id:"am9",th:"manip",e:"💊",t:"Metformine et iode : la règle ESUR",b:"Si le DFG est inférieur à 30 mL/min ou en cas d’insuffisance rénale aiguë, on arrête la metformine au moment de l’injection. On contrôle la fonction rénale dans les 48 h et on la reprend si elle est stable."},
 {id:"am10",th:"manip",e:"🫁",t:"Embolie pulmonaire en scinti : le « mismatch »",b:"La perfusion se fait aux MAA marqués au technétium, qui se bloquent dans les capillaires. Un défaut de perfusion avec une ventilation normale dans le même territoire évoque une embolie."},
 {id:"am11",th:"manip",e:"🫘",t:"DMSA ou MAG3 : ne plus les confondre",b:"Le DMSA se fixe sur le cortex rénal : scinti statique, cicatrices de pyélonéphrite, fonction relative. Le MAG3 est sécrété par les tubules : scinti dynamique, drainage et obstruction, avec test au furosémide."},
 {id:"am12",th:"manip",e:"🧪",t:"Technétium libre : où le retrouver",b:"Si la pureté radiochimique est insuffisante, le pertechnétate libre se fixe sur la thyroïde, l’estomac et les glandes salivaires. C’est ce que le contrôle qualité par chromatographie doit repérer avant injection."},
 {id:"am13",th:"manip",e:"🩸",t:"Leucocytes marqués : le risque n°1 n’est pas l’infection",b:"On prélève le sang du patient, on isole et marque ses leucocytes, puis on les lui réinjecte. L’erreur la plus grave est de réinjecter le sang d’un autre patient : la traçabilité de l’identité à chaque étape est vitale."},
 {id:"am14",th:"manip",e:"📊",t:"Ordres de grandeur de dose à connaître",b:"Radio du thorax : environ 0,02 mSv. Scanner abdomino-pelvien : de l’ordre de quelques mSv à une dizaine. Exposition naturelle en France : environ 3 mSv par an. Utile pour répondre à un patient inquiet."},
 {id:"am15",th:"manip",e:"🧊",t:"Le quench, uniquement en dernier recours",b:"L’hélium liquide s’évapore brutalement et l’aimant perd son champ. On le déclenche quand une personne est coincée par un objet attiré. Si l’hélium fuit dans la salle, risque d’asphyxie : on évacue."},
 // ---------- VOLLEY
 {id:"av1",th:"volley",e:"🧱",t:"Contre collé côté ligne : joue sa main extérieure",b:"Vise le bord extérieur de la main du contreur, avec le poignet ouvert vers l’extérieur. Le ballon touche le contre et sort : point pour toi. C’est souvent plus rentable que de forcer en diagonale."},
 {id:"av2",th:"volley",e:"👁️",t:"Un coup d’œil au contre avant de frapper",b:"Pendant ta montée, regarde le contre. Les deux contreurs mal fermés : frappe dans le trou entre eux. Ligne fermée : diagonale ou angle court. Contre en retard : frappe haute et profonde."},
 {id:"av3",th:"volley",e:"🎈",t:"Ballon haut du fond : ne pars pas trop tôt",b:"Sur une passe haute hors système, commence ton élan quand le ballon atteint son sommet. Face à un contre à trois, l’objectif n’est pas de tuer le point mais de mettre la défense en difficulté sans faire la faute : fond de terrain, zone 1, ballon qui gêne."},
 {id:"av4",th:"volley",e:"🌀",t:"Angle court : la frappe qui manque à beaucoup d’attaquants",b:"Depuis le poste 4, vise la diagonale très fermée vers les 3 mètres adverses. Le geste vient d’une pronation du poignet et de l’avant-bras au contact, sans changer l’élan pour ne rien annoncer."},
 {id:"av5",th:"volley",e:"🎯",t:"Réception du flottant : attends le ballon",b:"Le flottant change de trajectoire jusqu’au dernier moment. Place tes appuis tôt, mais présente ta plateforme tard, contact devant toi, angle donné par les épaules. Ne suis pas le ballon avec les bras."},
 {id:"av6",th:"volley",e:"🔄",t:"Transition : sors du filet en diagonale",b:"Après le contre, recule en diagonale vers ta zone d’élan, épaules ouvertes vers le terrain. Si tu cours en tournant le dos, tu perds la passe des yeux et tu arrives sans élan complet."},
 {id:"av7",th:"volley",e:"🧠",t:"Au contre : ballon, passeur, ballon, attaquant",b:"Après la passe, arrête de suivre le ballon et regarde l’attaquant : son épaule et son approche disent où il va frapper. Puis presse les mains au-dessus du filet, pouces vers le haut, sans balancer les bras."},
 {id:"av8",th:"volley",e:"🎾",t:"Service : vise l’attaquant, pas le vide",b:"Servir sur le réceptionneur qui doit ensuite attaquer perturbe son élan. Autres cibles payantes : la zone entre deux réceptionneurs, ou le joueur qui vient de rater une réception."},
 {id:"av9",th:"volley",e:"🦵",t:"Douleur sous la rotule au saut : le genou du sauteur",b:"La tendinopathie rotulienne se gère plus qu’elle ne se repose. Des exercices isométriques peuvent calmer la douleur, puis un renforcement lourd et lent reconstruit le tendon. Si ça dure, consulte un kiné du sport."},
 {id:"av10",th:"volley",e:"🦶",t:"Entorse de cheville : éviter la récidive",b:"La plupart arrivent en retombant sur le pied d’un adversaire sous le filet. Après une première entorse, le travail d’équilibre sur une jambe et une chevillère en match réduisent nettement le risque de recommencer."},
 {id:"av11",th:"volley",e:"🪶",t:"Le roulé, c’est une arme, pas un aveu de faiblesse",b:"Contre bien formé et défense reculée : un roulé avec du topspin derrière le contre ou au centre court du terrain. Utilisé une ou deux fois, il oblige la défense à avancer et rouvre la frappe profonde."},
 // ---------- HUMAIN
 {id:"ah1",th:"humain",e:"🧩",t:"« Si… alors… » : la phrase qui fait passer à l’action",b:"Les chercheurs appellent ça les intentions de mise en œuvre. « Si je rentre de cours, alors j’ouvre ma fiche avant mon téléphone. » Lier une action précise à un moment précis augmente fortement les chances de la faire."},
 {id:"ah2",th:"humain",e:"🔥",t:"Avant un oral ou un match, ne te dis pas « calme-toi »",b:"Dans une étude, les personnes qui se disaient « je suis excité » avant de parler en public étaient jugées meilleures que celles qui essayaient de se calmer. Le stress et l’excitation se ressemblent : renomme-le."},
 {id:"ah3",th:"humain",e:"🐢",t:"Procrastiner, ce n’est pas être paresseux",b:"Pour beaucoup de chercheurs, la procrastination est d’abord une façon d’éviter une émotion désagréable liée à la tâche : peur de mal faire, ennui, flou. Rends la tâche plus petite et plus claire, et l’envie de fuir baisse."},
 {id:"ah4",th:"humain",e:"🌪️",t:"Désamorcer une pensée catastrophe",b:"Une technique issue des thérapies cognitives et comportementales.",steps:["Quel est le pire scénario ?","Quel est le scénario le plus probable ?","Si le pire arrivait, que ferais-tu concrètement ?","Quelle petite action peux-tu faire maintenant ?"]},
 {id:"ah5",th:"humain",e:"💬",t:"Face à quelqu’un d’angoissé, ne rassure pas trop vite",b:"« Ça va aller » ferme souvent la conversation. Reformule plutôt ce que tu entends : « Vous avez peur que ça fasse mal ? » La personne se sent comprise, et c’est ça qui fait baisser l’angoisse. Valable avec un patient comme avec un pote."},
 {id:"ah6",th:"humain",e:"🗓️",t:"Utilise les nouveaux départs",b:"Un lundi, un début de mois, une rentrée, un anniversaire : les chercheurs ont montré qu’on est plus motivé à ces moments-là. Si tu veux changer une habitude, cale le démarrage sur un de ces repères."},
 {id:"ah7",th:"humain",e:"😌",t:"Après une conversation, l’autre t’apprécie plus que tu ne crois",b:"C’est le « liking gap » : après avoir discuté avec un inconnu, on sous-estime systématiquement combien il nous a appréciés. Ton impression d’avoir été bizarre est souvent fausse."},
 {id:"ah8",th:"humain",e:"🫶",t:"La bienveillance envers soi motive plus que l’autocritique",b:"Après un échec, des étudiants invités à se traiter avec compréhension ont ensuite travaillé plus longtemps pour progresser que ceux qui s’étaient juste remonté le moral. Se parler comme à un ami n’est pas se trouver des excuses."},
 {id:"ah9",th:"humain",e:"🤐",t:"Chacun croit être le seul à douter",b:"Comme personne ne parle de ses doutes, tout le monde a l’air sûr de lui : c’est l’ignorance pluraliste. Souvent, il suffit qu’une personne ose le dire pour que les autres suivent."},

 {id:"as1",th:"savoir",e:"🍝",t:"L’eau des pâtes est un ingrédient",b:"Elle est chargée d’amidon, qui lie la matière grasse et l’eau de ta sauce. Garde une louche avant d’égoutter, finis la cuisson des pâtes 1 minute dans la sauce avec un peu de cette eau : sauce nappante, plus aqueuse."},
 {id:"as2",th:"savoir",e:"🥩",t:"Pour bien saisir : poêle très chaude, viande sèche",b:"La croûte dorée vient de la réaction de Maillard, qui ne démarre bien qu’au-delà de 140 °C environ. Sèche la viande avec du papier, ne surcharge pas la poêle et ne la bouge pas pendant les premières minutes."},
 {id:"as3",th:"savoir",e:"🧂",t:"Sale ta viande longtemps à l’avance",b:"Salée au moins 40 minutes avant, ou la veille au frigo, la viande réabsorbe son jus salé : plus juteuse et assaisonnée à cœur. Salée juste avant la cuisson, c’est bien aussi. Entre les deux, elle rend de l’eau."},
 {id:"as4",th:"savoir",e:"🍚",t:"Le riz cuit, plus dangereux qu’on croit",b:"Une bactérie, Bacillus cereus, survit à la cuisson et produit des toxines à température ambiante. Mets le riz au frigo dans l’heure qui suit, et mange-le dans les 24 h. Réchauffe-le bien chaud, une seule fois."},
 {id:"as5",th:"savoir",e:"🍛",t:"Le dahl de lentilles corail, protéiné et pas cher",b:"Prêt en 25 minutes, se garde 3 jours au frigo.",steps:["Fais revenir un oignon avec du curry","Ajoute 200 g de lentilles corail rincées","Une boîte de tomates concassées et une de lait de coco","20 min à feu doux en remuant, sel, citron"]},
 {id:"as6",th:"savoir",e:"🧊",t:"Congèle à plat, décongèle en 20 minutes",b:"Mets restes, sauces ou viande hachée en sachet congélation, aplatis avant de fermer. Ça se range comme des livres et ça décongèle bien plus vite qu’un bloc."},
 {id:"as7",th:"savoir",e:"🔌",t:"Le disjoncteur saute : trouver le coupable",b:"Débranche tout sur le circuit, réenclenche, puis rebranche les appareils un par un. Celui qui fait sauter le disjoncteur est le coupable. Si c’est l’interrupteur différentiel qui saute souvent, pense humidité ou appareil défectueux."},
 {id:"as8",th:"savoir",e:"🩸",t:"Une tache de sang : eau froide, jamais chaude",b:"L’eau chaude cuit les protéines du sang et fixe la tache dans les fibres. Rince à l’eau froide le plus vite possible, frotte avec du savon. Utile pour les tenues de stage."},
 {id:"as9",th:"savoir",e:"🚰",t:"Évier bouché : le siphon d’abord",b:"Avant les produits, dévisse le siphon sous l’évier avec une bassine dessous : le bouchon est très souvent juste là. Les déboucheurs chimiques abîment les canalisations et brûlent la peau."},
 {id:"as10",th:"savoir",e:"📲",t:"SMS « colis », « ameli », « CPF » : le réflexe",b:"Ne clique jamais sur le lien. Ouvre toi-même l’appli ou le site officiel pour vérifier. Aucun organisme sérieux ne te demande tes coordonnées bancaires par SMS."},

 {id:"au6",th:"utile",e:"🔑",t:"Ta caution doit revenir sous 1 mois",b:"Si l’état des lieux de sortie est conforme à celui d’entrée, le propriétaire a 1 mois pour te rendre le dépôt de garantie, 2 mois sinon. Au-delà, il te doit des pénalités. Fais des photos datées le jour de l’entrée."},
 {id:"au7",th:"utile",e:"🧾",t:"Ta gratification de stage n’est pas imposable",b:"Elle est exonérée d’impôt sur le revenu dans la limite du montant annuel du SMIC. Pense quand même à la déclarer si tu fais ta propre déclaration."},

 {id:"bm1",th:"manip",ue:"irm",viz:"t1t2",e:"📈",t:"TR et TE : la pondération en une phrase",b:"TR court et TE court : T1. TR long et TE long : T2. TR long et TE court : densité de protons. Le TR joue sur la repousse longitudinale, le TE sur la décroissance transversale."},
 {id:"bm2",th:"manip",ue:"irm",viz:"larmor",e:"🌀",t:"La fréquence de Larmor, à connaître par cœur",b:"Les protons précessent à environ 42,6 MHz par tesla : 64 MHz à 1,5 T, 128 MHz à 3 T. L’impulsion RF doit être exactement à cette fréquence pour basculer l’aimantation : c’est la résonance."},
 {id:"bm3",th:"manip",ue:"irm",e:"🧠",t:"FLAIR : un T2 où le LCR devient noir",b:"C’est une inversion-récupération avec un TI long, choisi pour annuler le signal du liquide céphalorachidien. Les lésions au contact des ventricules, invisibles en T2 classique, ressortent alors en hypersignal."},
 {id:"bm4",th:"manip",ue:"irm",e:"🚫",t:"STIR : jamais après le gadolinium",b:"Le STIR annule les tissus dont le T1 est court, comme la graisse, grâce à un TI court. Il est robuste face aux inhomogénéités de champ. Mais le gadolinium raccourcit aussi le T1 : le tissu rehaussé serait annulé lui aussi."},
 {id:"bm5",th:"manip",ue:"irm",e:"🥓",t:"Fat sat spectrale ou Dixon ?",b:"Eau et graisse résonnent à 3,5 ppm d’écart, environ 220 Hz à 1,5 T. La fat sat spectrale vise cette fréquence mais rate dès que le champ est inhomogène (cou, métal). Le Dixon calcule eau et graisse séparément : bien plus robuste."},
 {id:"bm6",th:"manip",ue:"irm",e:"🌗",t:"Le liseré noir et blanc aux interfaces eau-graisse",b:"C’est le déplacement chimique : graisse et eau sont décalées l’une par rapport à l’autre dans la direction de codage de fréquence. Augmenter la bande passante réduit ce décalage, au prix d’un peu de signal."},
 {id:"bm7",th:"manip",ue:"irm",e:"👻",t:"Les images fantômes suivent la direction de phase",b:"Tout ce qui bouge (respiration, aorte, déglutition) crée des répliques dans la direction de codage de phase. Solutions : changer la direction de phase, bandes de saturation, synchronisation respiratoire ou cardiaque."},
 {id:"bm8",th:"manip",ue:"irm",e:"💧",t:"Diffusion : vérifie toujours l’ADC",b:"Une vraie restriction (AVC aigu, abcès, tumeur très cellulaire) est en hypersignal en diffusion avec un ADC bas. Hypersignal en diffusion mais ADC normal ou élevé : c’est l’effet T2 shine-through, pas une restriction."},
 {id:"bm9",th:"manip",ue:"irm",e:"🔥",t:"Brûlures RF : casse toutes les boucles",b:"Mains jointes, mollets qui se touchent, câble enroulé : ce sont des boucles conductrices où la RF induit du courant. Coussins isolants entre les zones de contact, câbles droits sans toucher la peau."},
 {id:"bm10",th:"manip",ue:"irm",e:"🧲",t:"L’aimant n’est jamais éteint",b:"Un aimant supraconducteur garde son champ en permanence, même machine à l’arrêt, la nuit ou pendant le ménage. Le contrôle d’accès en zone IV s’applique donc 24 h sur 24."},
 {id:"bm11",th:"manip",ue:"irm",e:"🧷",t:"Valve de dérivation programmable : contrôle après IRM",b:"Le champ magnétique peut modifier le réglage de certaines valves de dérivation ventriculaire. On vérifie le modèle avant, et le réglage est contrôlé après l’examen selon les consignes du fabricant."},
 {id:"bm12",th:"manip",ue:"irm",e:"📶",t:"Doubler les acquisitions ne double pas le signal",b:"Le rapport signal sur bruit augmente comme la racine du nombre d’excitations. Passer de 1 à 4 NEX multiplie le temps par 4 pour un SNR seulement doublé."},
 {id:"bm13",th:"manip",ue:"irm",e:"🧊",t:"Coupe deux fois plus fine, SNR divisé par 2",b:"Le signal est proportionnel au volume du voxel. Affiner la coupe ou augmenter la matrice améliore la résolution mais coûte du signal : il faut compenser par du temps ou une meilleure antenne."},
 {id:"bm14",th:"manip",ue:"irm",e:"📡",t:"L’antenne au plus près, toujours",b:"Le signal capté chute vite avec la distance. Une antenne de surface bien plaquée sur la zone donne bien plus de SNR qu’une antenne corps entier : c’est souvent le réglage le plus rentable."},

 // ===== SCANNER
 {id:"bm16",th:"manip",ue:"scanner",viz:"fenetre",e:"🎚️",t:"Les fenêtres de base",b:"Parties molles : niveau autour de 40, largeur autour de 400. Poumon : niveau vers −600, largeur vers 1500. Os : niveau de quelques centaines, largeur très large. Les valeurs varient un peu selon les services."},
 {id:"bm17",th:"manip",ue:"scanner",e:"🧮",t:"CTDIvol, DLP, dose efficace",b:"Le CTDIvol est la dose moyenne dans le volume d’une coupe, en mGy. Le DLP le multiplie par la longueur explorée, en mGy·cm. Dose efficace ≈ DLP × un coefficient selon la région, environ 0,015 pour l’abdomen adulte."},
 {id:"bm18",th:"manip",ue:"scanner",e:"🎯",t:"Patient décentré = plus de dose et plus de bruit",b:"Le filtre papillon et la modulation automatique des mA supposent un patient centré dans l’anneau. Trop haut ou trop bas sur la table, la dose et le bruit augmentent. Centrer, c’est déjà optimiser."},
 {id:"bm19",th:"manip",ue:"scanner",e:"🙌",t:"Le topogramme règle la modulation de dose",b:"La modulation des mA est calculée sur le topogramme. Bras le long du corps sur un thorax-abdomen : stries, mA qui s’envolent et dose inutile. On lève les bras avant le topo, pas après."},
 {id:"bm20",th:"manip",ue:"scanner",e:"🌀",t:"Le pitch",b:"Avancement de la table par rotation divisé par la largeur de collimation. À mAs par rotation constants, un pitch plus élevé réduit la dose et la durée d’acquisition, au prix de plus de bruit."},
 {id:"bm21",th:"manip",ue:"scanner",e:"🔪",t:"Filtre dur ou filtre mou",b:"Le filtre dur rend les contours nets mais augmente le bruit : os, poumon. Le filtre mou lisse l’image : parties molles, cerveau. Même acquisition, deux reconstructions, deux usages."},
 {id:"bm22",th:"manip",ue:"scanner",e:"🧱",t:"Effet de volume partiel",b:"Une structure plus fine que la coupe voit sa densité moyennée avec celle de ce qui l’entoure. Un petit nodule ou un fin trait de fracture peut disparaître. Solution : reconstruire en coupes fines."},
 {id:"bm23",th:"manip",ue:"scanner",e:"🧑‍💻",t:"Reconstruction itérative",b:"Elle réduit le bruit bien mieux que la rétroprojection filtrée, ce qui permet de baisser la dose. Poussée trop fort, l’image prend un aspect lisse et « plastique » qui peut gêner les radiologues."},
 // ===== PDC

 // ===== RADIOPROT
 {id:"bm44",th:"manip",ue:"radioprot",viz:"inverse",e:"📏",t:"Double la distance, divise la dose par 4",b:"Pour une source ponctuelle, le débit de dose suit l’inverse du carré de la distance. Reculer d’un pas pendant une scopie ou une injection, c’est l’une des protections les plus efficaces et les plus gratuites."},
 {id:"bm45",th:"manip",ue:"radioprot",e:"🎨",t:"Les couleurs du trèfle",b:"Bleu : zone surveillée. Vert : zone contrôlée. Jaune, orange, rouge : zones contrôlées spécialement réglementées, d’accès de plus en plus restreint, rouge étant interdite."},
 {id:"bm46",th:"manip",ue:"radioprot",e:"📛",t:"Dosimètre passif et dosimètre opérationnel",b:"Le passif mesure ta dose cumulée sur une période. L’opérationnel, obligatoire en zone contrôlée, affiche la dose en temps réel et peut alarmer. Ce sont deux outils complémentaires."},
 {id:"bm47",th:"manip",ue:"radioprot",e:"👶",t:"Travailleuse enceinte : 1 mSv pour l’enfant",b:"Dès la déclaration de grossesse, l’exposition de l’enfant à naître doit rester inférieure à 1 mSv jusqu’à la naissance. Le poste de travail est adapté en conséquence."},
 {id:"bm48",th:"manip",ue:"radioprot",e:"📋",t:"20 mSv par an",b:"C’est la limite de dose efficace sur 12 mois consécutifs pour les travailleurs exposés en France. Pour le public, c’est 1 mSv par an, hors exposition médicale et naturelle."},
 // ===== SOIN
 {id:"bm49",th:"manip",ue:"soin",e:"🪪",t:"Identitovigilance : des questions ouvertes",b:"Demande « Pouvez-vous me dire votre nom, prénom et date de naissance ? » plutôt que « Vous êtes bien M. Martin ? ». Un patient stressé, sourd ou désorienté répond oui à tout."},
 {id:"bm50",th:"manip",ue:"soin",e:"🤐",t:"« Vous voyez quelque chose ? »",b:"Ce n’est pas au manipulateur d’annoncer un résultat. Une réponse honnête et rassurante : « C’est le radiologue qui interprète les images, il vous expliquera. » Sans mimique inquiète devant l’écran."},
 {id:"bm51",th:"manip",ue:"soin",e:"😰",t:"Patient claustrophobe en IRM",b:"Explique le déroulé, montre la poire d’appel, propose les pieds en premier si l’examen le permet, un masque sur les yeux, de la musique. Parle-lui entre les séquences : savoir combien de temps il reste aide énormément."},
 {id:"bm52",th:"manip",ue:"soin",e:"🗣️",t:"Patient agressif : désamorcer",b:"Garde une distance de sécurité et une sortie dégagée, baisse le ton et le débit, nomme l’émotion (« Je vois que l’attente vous agace »). Pas de contact physique, et appelle de l’aide sans attendre si ça monte."},
 // ===== VOLLEY
 {id:"bv1",th:"volley",e:"🏹",t:"L’armé de l’arc",b:"Au décollage, le bras non frappeur pointe vers le ballon, le bras frappeur monte coude haut, main près de l’oreille. Le tronc est tourné : c’est sa rotation qui donne la vitesse, pas seulement le bras."},
 {id:"bv2",th:"volley",e:"🔝",t:"Le topspin, c’est la main qui enveloppe",b:"Main ouverte et souple, le poignet bascule vers l’avant au contact. Le ballon prend une rotation avant et plonge grâce à l’effet Magnus : tu peux frapper plus fort sans qu’il sorte."},
 {id:"bv3",th:"volley",e:"🍃",t:"Pourquoi le flottant flotte",b:"Sans rotation, l’air décroche de façon irrégulière autour du ballon, d’un côté puis de l’autre. Les forces changent de sens en vol et la trajectoire zigzague, surtout quand le ballon ralentit."},
 {id:"bv4",th:"volley",e:"🪂",t:"Le jump float",b:"Lancer bas et devant, petit élan, frappe courte au centre du ballon et main qui s’arrête net. Le point de frappe plus haut donne une trajectoire plus tendue, plus difficile à lire qu’un flottant au sol."},
 {id:"bv5",th:"volley",e:"🛡️",t:"Couvre ton attaquant",b:"Quand un coéquipier attaque, descends bas autour de lui, à 1-2 m, bras prêts. La majorité des ballons contrés retombent près de l’attaquant : c’est un point sauvé presque gratuit."},
 {id:"bv6",th:"volley",e:"🔁",t:"Le replay : jouer le contre exprès",b:"Passe trop serrée et contre bien en place : pousse doucement le ballon dans le contre pour qu’il revienne dans ton camp. Ton équipe récupère et relance une attaque en système."},
 {id:"bv7",th:"volley",e:"📏",t:"Passe décollée du filet : vise le fond",b:"Plus tu frappes loin du filet, moins tu as d’angle vers le bas. Cherche le fond du terrain et les zones profondes avec du topspin plutôt que de forcer une frappe courte qui finira dans le filet."},
 {id:"bv8",th:"volley",e:"👐",t:"Ballon reçu sur le côté : baisse l’épaule extérieure",b:"Quand le ballon arrive à l’extérieur de ton corps, abaisse l’épaule la plus éloignée de la cible pour incliner la plateforme vers la passeuse, au lieu de tourner les bras."},
 {id:"bv9",th:"volley",e:"⚡",t:"Le petit saut au moment du service adverse",b:"Un léger split step juste avant que le serveur frappe te met sur l’avant des pieds, prêt à partir dans toutes les directions. Attendre à plat, c’est perdre un temps de réaction."},
 {id:"bv10",th:"volley",e:"🧘",t:"Focus externe : pense à la cible, pas au geste",b:"Les études sur l’apprentissage moteur montrent qu’on performe mieux en se concentrant sur l’effet recherché (« la zone 1 adverse ») qu’en pensant à son corps (« mon coude »). Garde les détails techniques pour l’entraînement."},
 {id:"bv11",th:"volley",e:"🔥",t:"L’échauffement RAMP",b:"Raise : faire monter la température. Activate : réveiller fessiers et épaules. Mobilize : amplitude articulaire. Potentiate : quelques sauts et frappes à intensité maximale juste avant le match."},
 {id:"bv12",th:"volley",e:"🦘",t:"Les pogo jumps pour des appuis réactifs",b:"Petits sauts rapides, jambes presque tendues, contact au sol le plus court possible. Ils entraînent la raideur de la cheville et du tendon d’Achille, utile pour l’élan et la défense."},
 {id:"bv13",th:"volley",e:"🏖️",t:"Beach : le vent change ton service",b:"Face au vent, un flottant devient encore plus imprévisible : c’est le moment de le servir. Vent dans le dos, le ballon porte loin : sers plus tendu ou plus court pour ne pas sortir."},
 {id:"bv14",th:"volley",e:"✊",t:"Beach : le poke et le cut",b:"En beach, la feinte main ouverte est interdite. On joue un poke avec les jointures pour passer au-dessus du contre, ou un cut shot, frappe très croisée qui retombe près du filet."},
 {id:"bv15",th:"volley",e:"🍌",t:"Entre deux matchs de tournoi",b:"Mange des glucides faciles à digérer et bois régulièrement dès la fin du match. Reste en mouvement léger, garde-toi au chaud, et refais 5 minutes d’activation avant de reprendre."},
 {id:"bv16",th:"volley",e:"🧍",t:"Défense : lis l’épaule de l’attaquant",b:"Position basse, poids sur l’avant des pieds, immobile au moment de la frappe. L’orientation de l’épaule et du bras de l’attaquant indique la direction. Bouger pendant la frappe, c’est se faire prendre à contre-pied."},
 // ===== HUMAIN
 {id:"bh1",th:"humain",e:"✍️",t:"Écrire ce qui te tracasse",b:"Écrire librement pendant 15 à 20 minutes sur ce qui te pèse, plusieurs jours de suite, a montré des effets positifs sur le bien-être dans de nombreuses études. Personne n’a besoin de le lire, même pas toi.",src:"Pennebaker"},
 {id:"bh2",th:"humain",e:"🛏️",t:"Ta to-do de demain t’aide à t’endormir",b:"Dans une étude, les personnes qui écrivaient la liste de ce qu’elles avaient à faire le lendemain s’endormaient plus vite que celles qui notaient ce qu’elles avaient déjà fait. Vider sa tête sur papier, ça marche.",src:"Scullin et al., 2018"},
 {id:"bh3",th:"humain",e:"❓",t:"Remplace « pourquoi » par « qu’est-ce qui »",b:"« Pourquoi tu as fait ça ? » sonne comme un reproche et met sur la défensive. « Qu’est-ce qui s’est passé ? » invite à raconter. Petite nuance, grosse différence dans une discussion tendue."},
 {id:"bh4",th:"humain",e:"🎭",t:"Le syndrome de l’imposteur",b:"L’impression de ne pas mériter sa place et d’être un jour « démasqué » est très répandue, surtout chez les étudiants en santé. Le simple fait de savoir que les autres le ressentent aussi diminue son poids."},
 {id:"bh5",th:"humain",e:"⏸️",t:"Le silence de 3 secondes",b:"Quand quelqu’un finit de parler, attends 3 secondes avant de répondre. Très souvent, il ajoute l’information la plus importante. Avec un patient, c’est là que sortent les vraies inquiétudes."},
 {id:"bh6",th:"humain",e:"🔟",t:"Décider avec la règle 10/10/10",b:"Comment je me sentirai à propos de ce choix dans 10 minutes ? Dans 10 mois ? Dans 10 ans ? Ça remet la peur du moment à sa vraie place."},
 {id:"bh7",th:"humain",e:"🔗",t:"Accroche une habitude à une autre",b:"« Après mon café, je relis une fiche. » Greffer une nouvelle habitude sur un geste que tu fais déjà tous les jours évite d’avoir à t’en souvenir."},
 {id:"bh8",th:"humain",e:"🚶",t:"La motivation vient après l’action",b:"On attend d’être motivé pour commencer, alors que c’est souvent l’inverse : commencer crée l’élan. Le premier pas peut être ridiculement petit, l’important est qu’il existe."},
 {id:"bh9",th:"humain",e:"🙏",t:"Trois bonnes choses",b:"Le soir, note trois choses qui se sont bien passées et pourquoi. Des études ont montré une amélioration modeste mais durable du bien-être. Ça entraîne le cerveau à repérer le positif.",src:"Seligman et al., 2005"},
 {id:"bh10",th:"humain",e:"🏥",t:"Premier jour de stage : 3 questions qui changent tout",b:"« Comment vous préférez que je participe ? » « Qu’est-ce qui serait utile que je sache faire d’ici la fin de la semaine ? » « Je peux vous demander un retour vendredi ? » Tu passes d’observateur à membre de l’équipe."},
 {id:"bh11",th:"humain",e:"🌧️",t:"Après une prise en charge difficile, parles-en",b:"Un décès, un enfant qui pleure, un patient agressif : en parler à un collègue ou à ton tuteur n’est pas un signe de fragilité. Les équipes qui débriefent les moments durs tiennent mieux dans la durée."},
 {id:"bh12",th:"humain",e:"🌳",t:"10 minutes de marche quand ça ne va pas",b:"Une courte marche, idéalement dehors, améliore l’humeur de façon mesurable. Ça ne règle pas le problème, mais ça le rend souvent plus facile à regarder."},
 // ===== SAVOIR-FAIRE
 {id:"bs1",th:"savoir",e:"🥗",t:"La vinaigrette qui ne se sépare pas",b:"Une part de vinaigre pour trois d’huile. La moutarde est l’émulsifiant : mets-la avec le vinaigre et le sel, puis ajoute l’huile en filet en fouettant. Le sel ne se dissout pas dans l’huile : ajoute-le avant."},
 {id:"bs2",th:"savoir",e:"🔪",t:"Le fusil n’affûte pas",b:"Il réaligne le fil du couteau, ce qui le rend plus efficace entre deux affûtages. Quand le couteau ne coupe vraiment plus, il faut une pierre ou un aiguiseur. Un couteau émoussé glisse et coupe plus les doigts."},
 {id:"bs3",th:"savoir",e:"🧅",t:"Des oignons caramélisés, ça prend 40 minutes",b:"Feu moyen-doux, un peu de sel, on remue de temps en temps. En 10 minutes à feu vif, ils sont juste brûlés dehors et crus dedans. Si ça attache, un trait d’eau et on gratte les sucs."},
 {id:"bs4",th:"savoir",e:"🥚",t:"Œuf frais ou pas ? Le test de l’eau",b:"Dans un verre d’eau, un œuf frais coule et reste à plat. En vieillissant, sa poche d’air grossit : il se redresse, puis flotte. Un œuf qui flotte va à la poubelle."},
 {id:"bs5",th:"savoir",e:"🌡️",t:"Le poulet est cuit à 74 °C à cœur",b:"La couleur ne suffit pas. Un thermomètre de cuisine à quelques euros enlève tout doute, au point le plus épais, sans toucher l’os."},
 {id:"bs6",th:"savoir",e:"❄️",t:"Décongeler au frigo, jamais sur le plan de travail",b:"À température ambiante, l’extérieur se réchauffe pendant que le centre est encore gelé : les bactéries se multiplient en surface. Au frigo la veille, ou dans l’eau froide en sachet fermé pour aller plus vite."},
 {id:"bs7",th:"savoir",e:"🧄",t:"L’ail brûle vite",b:"Ajoute-le après l’oignon, une minute avant le reste. Brûlé, il devient amer et gâche le plat."},
 {id:"bs8",th:"savoir",e:"🧀",t:"Moisissure : ce qu’on garde, ce qu’on jette",b:"Fromage à pâte dure : on retire 2 à 3 cm autour de la tache. Pain, confiture, yaourt, fromage frais, restes cuisinés : tout à la poubelle, les filaments invisibles vont bien plus loin que la tache."},
 {id:"bs9",th:"savoir",e:"🚲",t:"Chaîne de vélo : moins d’huile, plus souvent",b:"Nettoie la chaîne, une goutte d’huile par maillon en tournant le pédalier, puis essuie tout l’excès. L’huile en surface attire la poussière, qui use la transmission."},
 {id:"bs10",th:"savoir",e:"🍳",t:"Tache de graisse : avant le lavage",b:"Une goutte de liquide vaisselle frottée doucement, ou du talc pour absorber si c’est frais, avant la machine. Une fois passée au sèche-linge, la tache est presque impossible à enlever."},
 {id:"bs11",th:"savoir",e:"🔐",t:"Un bon mot de passe est une phrase",b:"Quatre mots aléatoires forment un mot de passe long, facile à retenir et dur à casser. Ajoute un gestionnaire de mots de passe et la double authentification sur ta boîte mail : c’est elle qui protège tout le reste."},
 {id:"bs12",th:"savoir",e:"💾",t:"La règle 3-2-1 pour tes cours",b:"3 copies de tes fichiers, sur 2 supports différents, dont 1 hors de chez toi (cloud). Un ordi qui meurt la veille des partiels, ça arrive vraiment."},
 {id:"bs13",th:"savoir",e:"☕",t:"Détartrer la bouilloire",b:"Remplis à moitié d’eau et de vinaigre blanc ou d’acide citrique, fais chauffer, laisse agir une heure, rince plusieurs fois. Le calcaire rallonge la chauffe et donc la facture."},
 {id:"bs14",th:"savoir",e:"🧺",t:"Draps et serviettes à 60 °C",b:"Cette température élimine la plupart des microbes et des acariens. Pour le reste du linge, 30 °C suffit et économise de l’énergie."},
 // ===== UTILE
 {id:"bu1",th:"utile",e:"👶",t:"La méthode Feynman",b:"Explique la notion comme à un enfant de 12 ans, sans jargon. Là où tu bloques, c’est que tu n’as pas compris. Retourne au cours sur ce point précis, puis réessaie."},
 {id:"bu2",th:"utile",e:"🖼️",t:"Un schéma + des mots, c’est mieux que des mots seuls",b:"Associer une notion à un dessin ou un schéma crée deux chemins pour la retrouver en mémoire. Dessine la séquence d’écho de spin, le générateur ou la chaîne de détection plutôt que de recopier des phrases."},
 {id:"bu3",th:"utile",e:"🌙",t:"La veille du partiel, dors",b:"C’est pendant le sommeil que la mémoire consolide ce que tu as appris. Une nuit blanche fait perdre plus de points qu’elle n’en fait gagner."},
 {id:"bu4",th:"utile",e:"🗒️",t:"En examen, lis tout avant d’écrire",b:"Parcours toutes les questions d’abord, commence par ce que tu maîtrises pour prendre confiance et des points sûrs. En QCM, entoure les négations : « ne… pas », « sauf », « jamais »."},
 {id:"bu5",th:"utile",e:"🏥",t:"Plus de sécu étudiante",b:"Depuis 2019, les étudiants sont affiliés au régime général de l’Assurance maladie. Tu n’as rien à payer pour ça : la mutuelle complémentaire, elle, reste facultative et à choisir toi-même."},
 {id:"bu6",th:"utile",e:"🛡️",t:"L’assurance habitation est obligatoire",b:"Pour un locataire, l’assurance des risques locatifs est obligatoire, et le propriétaire peut te demander une attestation chaque année. Ça coûte quelques euros par mois pour un studio."},
 {id:"bu7",th:"utile",e:"📦",t:"Quitter son logement : le préavis",b:"Meublé : 1 mois. Vide : 3 mois en principe, réduit à 1 mois en zone tendue et dans certains cas (premier emploi, mutation, perte d’emploi…). Envoie ta lettre en recommandé avec accusé de réception."},
 {id:"bu8",th:"utile",e:"🤝",t:"Pas de garant ? Visale",b:"Action Logement se porte garant gratuitement pour les jeunes de 18 à 30 ans auprès du propriétaire. La demande se fait en ligne et rassure beaucoup les bailleurs."},
 {id:"bu9",th:"utile",e:"🐖",t:"LEP plutôt que Livret A, si tu y as droit",b:"Le Livret d’épargne populaire rapporte plus que le Livret A, mais il est réservé aux revenus modestes. Beaucoup d’étudiants y ont droit sans le savoir : demande à ta banque."},
 {id:"bu10",th:"utile",e:"📱",t:"Limite tes applis dans Bien-être numérique",b:"Sur Android, Paramètres puis Bien-être numérique : tu peux fixer une durée maximale par appli. Une fois atteinte, l’icône se grise jusqu’au lendemain."},
 {id:"bu11",th:"utile",e:"📅",t:"Bloque tes révisions comme un rendez-vous",b:"Une plage « Révision IRM – 18 h-18 h 45 » dans ton agenda a beaucoup plus de chances d’arriver qu’un vague « je réviserai ce soir »."},
 {id:"bu12",th:"utile",e:"🎤",t:"Entretien pour un stage : prépare 2 questions",b:"« Quels examens je pourrai réaliser en autonomie ? » « Comment se passe l’encadrement des étudiants ? » Poser des questions montre ta motivation et t’aide à choisir."},
 {id:"bu13",th:"utile",e:"💳",t:"Fais la chasse aux abonnements",b:"Regarde tes 3 derniers relevés bancaires et liste tout ce qui revient chaque mois. Musique, streaming, applis oubliées : supprimer ce que tu n’utilises plus, c’est des économies sans effort."}
];

 {id:"bq13",th:"savoir",q:"Un œuf flotte dans l’eau. Il est…",o:["Très frais","Vieux, à jeter"],a:1,x:"La poche d’air grossit avec le temps."},
